# Общие настройки команды для этого проекта.
[agents]
enabled = true

# До десяти одновременно открытых веток субагентов, основной агент не учитывается.
max_concurrent_threads_per_session = 10

# Модель и уровень рассуждения здесь намеренно не заданы.
# При отсутствии других переопределений субагенты наследуют их от основного агента.
