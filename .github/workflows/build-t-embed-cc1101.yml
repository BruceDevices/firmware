name: Build LILYGO T-Embed CC1101

on:
  push:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.ini"
      - "**.py"
      - ".github/workflows/build-t-embed-cc1101.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.ini"
      - "**.py"
      - ".github/workflows/build-t-embed-cc1101.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-platformio-lilygo-t-embed-cc1101-${{ hashFiles('platformio.ini', 'boards/lilygo-t-embed-cc1101/*.ini') }}

      - name: Install build tools
        run: python -m pip install platformio requests esptool intelhex

      - name: Build firmware
        run: platformio run -e lilygo-t-embed-cc1101
