# Universal IR - custom remote layouts
# Place this file in /UniversalIR on the SD card.
#
# Syntax:
#   [category-name]          -> must match a folder inside /UniversalIR/assets
#                               (case-insensitive)
#   Button label:search1,search2,search3
#                            -> label is what appears on the device,
#                               the searches are IR signal names that
#                               button will trigger across all brand files.
#
# Lines starting with # are comments. A section replaces the built-in
# layout for that category. Categories without a section keep their
# automatic behaviour (TV/AC get a standard remote, others show brands).

[projectors]
Power:Power,Power_toggle
Input:Input,Source
Menu:Menu
Exit:Exit,Exit_menu
OK:OK,Select,Enter
Up:Up,Up_arrow
Down:Down,Down_arrow
Left:Left,Left_arrow
Right:Right,Right_arrow
Info:Info
Volume +:Vol_up,Vol+,Volume_up
Volume -:Vol_dn,Vol-,Volume_down

# [tvs]
# Power:Power
# Mute:Mute
# Channel +:Ch_next,Ch+,Channel_up
# Channel -:Ch_prev,Ch-,Channel_down
