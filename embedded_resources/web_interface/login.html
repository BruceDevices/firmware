<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce - Login</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
    <div class="login-wrapper">
        <form action="/login" method="POST" class="login-card">
            <div class="dialog-head">Bruce Login</div>
            <div class="dialog-body">
                <div id="notice" style="display:none"></div>
                <label for="username">Username</label>
                <input type="text" name="username" id="username" autocomplete="username" autofocus style="margin-bottom: 16px;">

                <label for="password">Password</label>
                <input type="password" name="password" id="password" autocomplete="current-password">
            </div>
            <div class="dialog-footer">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const notice = document.getElementById('notice');
        if (params.has('failed')) {
            notice.style.display = 'block';
            notice.textContent = 'Login failed — please try again.';
        } else if (params.has('loggedout')) {
            notice.style.display = 'block';
            notice.className = 'success-notice';
            notice.textContent = 'You have been logged out.';
        }
    </script>
</body>
</html>
