<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce - Login</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
    <div class="login-wrap">
        <form action="/login" method="POST" class="login-card">
            <h2>Bruce Login</h2>
            <div id="notice" style="display:none"></div>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-input" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-input" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-accent" style="width:100%;margin-top:8px;padding:10px;">Login</button>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const notice = document.getElementById('notice');
        if (params.has('failed')) {
            notice.style.display = 'block';
            notice.className = 'notice error';
            notice.textContent = 'Login failed — please try again.';
        } else if (params.has('loggedout')) {
            notice.style.display = 'block';
            notice.className = 'notice info';
            notice.textContent = 'You have been logged out.';
        }
    </script>
</body>
</html>
