; PlatformIO Project Configuration File
;
; Accretion Phone - DIY handheld ("HP DIY") based on ESP32-S3
;
; Hardware:
;   - ESP32-S3, 16MB QSPI flash, 8MB OPI PSRAM
;   - ILI9341 2.8" 240x320 TFT (SPI)
;   - XPT2046 resistive touch on its OWN SPI bus (no IRQ pin wired)
;   - microSD in SDIO 1-bit mode (SD_MMC)
;   - INMP441 I2S microphone
;   - WS2812 RGB LED, vibration motor, battery ADC (1:2 divider)
;   - MPU6050 on I2C
;
; Pin map lives in boards/accretion-phone/pins_arduino.h

[env:accretion-phone]
board = accretion-phone
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/accretion-phone>
build_flags =
	${env.build_flags}
	-Iboards/accretion-phone
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Accretion Phone"'

	; The base config sets the AsyncTCP task stack to 4096 bytes. WebUI handlers here touch LittleFS and the
	; SD card (SD_MMC/FatFs), which need more. Later -D wins (the compiler only warns about the redefinition).
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192

	; TFT on the HSPI/SPI3 controller (AUX_SPI ends up on FSPI/SPI2, used by the touch chip)
	-DUSE_HSPI_PORT=1

	; SD card via SDIO 1-bit (SD_MMC) - not SPI
	-DUSE_SD_MMC=1
	; 20 MHz instead of the 40 MHz default: much more tolerant of DIY / jumper-wire SDIO wiring
	-DBOARD_MAX_SDMMC_FREQ=20000
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	; Touch XPT2046 on a dedicated SPI bus (read by lib/CYD-touch/CYD28_TouchscreenR)
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=6
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=5
	-DXPT2046_SPI_BUS_MISO_IO_NUM=4
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=9

	; INMP441 microphone (pins in pins_arduino.h)
	-DMIC_INMP441

	; Touch axis tweaks - if touch is mirrored on your unit, flip these (0/1)
	-DACCRETION_TOUCH_INVERT_X=0
	-DACCRETION_TOUCH_INVERT_Y=0

	; SPI-DMA for full-screen sprite pushes (anti-flicker on screen transitions).
	; See lib/HAL/display/tftespi.cpp (pushSprite) and boards/accretion-phone/interface.cpp
	; (_post_setup_gpio). Comment this one line out to instantly revert to the old
	; blocking pushSprite path if something looks wrong on real hardware.
	-DACCRETION_TFT_DMA=1

lib_deps =
	${env.lib_deps}

lib_ignore =
	SD
