; Waveshare ESP32-C5-WIFI6-KIT (ESP32-C5-WROOM-1 / -1U, N16R8 or N32R8)
; + 2.8" ILI9341 240x320 SPI screen with XPT2046 resistive touch (LCDwiki MSP2807).
; Wiring: connections.md. Based on boards/ESP32-C5-tft.
;
; Why not the esp32-c5-tft pin map: on this kit GPIO6 is tied (R39, 0 ohm) to the battery-sense
; divider, which has a 100 nF capacitor to GND, so GPIO6 cannot carry the SPI clock (white screen).
; The display uses the pins from Waveshare's own ILI9341 demo for this kit, and GPIO6 only drives
; the backlight (a steady level is fine).

[env:waveshare-c5-kit-ili9341]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-c5-kit-ili9341>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-c5-kit-ili9341

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Serial log on the USB-C port labelled USB (the UART port is for flashing)
	-DARDUINO_USB_MODE=1  ; USB peripheral mode (1 = USB-Serial/JTAG)
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; any free GPIO can be chosen for IR / one-pin RF
	-DHAS_RGB_LED=1  ; on-board WS2812 on GPIO27
	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp), shares the display SPI
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6  ; steady level / PWM only: GPIO6 carries the battery-sense capacitor
	-DTFT_RST=4  ; driven by TFT_eSPI (the board's RST/EN pin is slow and pulled by USB auto-reset)
	-DTFT_DC=3
	-DTFT_MISO=7
	-DTFT_MOSI=2
	-DTFT_SCLK=1
	-DTFT_CS=5
	-DTOUCH_CS=23
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000  ; what Waveshare's demo runs on these pins; drop to 20000000 if the picture glitches
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DCYD28_TouchR_IRQ=-1  ; T_IRQ not connected
	-DCYD28_TouchR_MISO=7
	-DCYD28_TouchR_MOSI=2
	-DCYD28_TouchR_CLK=1
	-DCYD28_TouchR_CS=23

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-C5 ILI9341"'
	-DBTN_ALIAS='"OK"'
	-DROTATION=1
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
lib_deps =
	${env.lib_deps}
