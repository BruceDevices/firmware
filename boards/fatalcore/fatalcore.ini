[env:fatalcore]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/fatalcore>
build_flags =
	${env.build_flags}
	-Iboards/fatalcore
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSB_as_HID=1
	-DDEVICE_NAME='"Fatalcore"'
	-DHAS_6_BUTTONS=1
	-DHAS_RGB_LED=1
	-DUSE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MOSI=18
	-DTFT_SCLK=17
	-DTFT_MISO=8
	-DTFT_CS=7
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DROTATION=1
	-DBTN_ALIAS='"OK"'
	-DDEEPSLEEP_WAKEUP_PIN=21
	-DDEEPSLEEP_PIN_ACT=LOW
	-DIR_TX_PINS='{{"GPIO 2", 2}, {"GPIO 42", 42}}'
	-DIR_RX_PINS='{{"GPIO 1", 1}, {"GPIO 42", 42}}'
	-DRF_TX_PINS='{{"GPIO 42", 42}}'
	-DRF_RX_PINS='{{"GPIO 42", 42}}'
	-DLORA_BUSY=3
	-DRGB_LED=44
	-DLED_TYPE=WS2812B
	-DLED_ORDER=RGB
	-DLED_TYPE_IS_RGBW=0
	-DLED_COUNT=1
	-DLED_COLOR_STEP=5

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit INA219
