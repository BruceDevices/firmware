; Heltec WiFi LoRa 32 V4-R8 with Expansion Kit V2 (high-frequency SX1262).
[env:heltec-v4-expansion-v2]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 921600
board_build.partitions = custom_16Mb.csv
extra_scripts =
	${env.extra_scripts}
	post:boards/heltec-v4-expansion-v2/post_build.py
build_src_filter = ${env.build_src_filter} +<../boards/heltec-v4-expansion-v2>
build_flags =
	${env.build_flags}
	-Iboards/heltec-v4-expansion-v2
	-DHELTEC_V4_EXPANSION_V2
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DUSE_TFT_ESPI=1
	-DDEVICE_NAME='"Heltec V4 Expansion V2"'
	-DUSB_as_HID=1
	-DSPI_SCK_PIN=16
	-DSPI_MISO_PIN=45
	-DSPI_MOSI_PIN=15
	-DSPI_SS_PIN=3
	-DSDCARD_CS=3
	-DSDCARD_SCK=SPI_SCK_PIN
	-DSDCARD_MISO=SPI_MISO_PIN
	-DSDCARD_MOSI=SPI_MOSI_PIN
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DSUPPORT_TRANSACTIONS=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MOSI=SPI_MOSI_PIN
	-DTFT_MISO=SPI_MISO_PIN
	-DTFT_SCLK=SPI_SCK_PIN
	-DTFT_CS=47
	-DTFT_DC=48
	-DTFT_RST=21
	-DTFT_BL=44
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=8000000
	-DSMOOTH_FONT=1
	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DROTATION=1
	-DMINBRIGHT=5
	-DSYS_I2C_SDA=17
	-DSYS_I2C_SCL=18
	-DHELTEC_TOUCH_ADDRESS=0x2E
	-DGROVE_SDA=-1
	-DGROVE_SCL=-1
	-DLORA_SCK=9
	-DLORA_MISO=11
	-DLORA_MOSI=10
	-DLORA_CS=8
	-DLORA_RST=12
	-DLORA_DIO0=14
	-DLORA_IRQ=14
	-DLORA_BUSY=13
	-DLORA_FEM_POWER=7
	-DLORA_FEM_ENABLE=2
	-DLORA_FEM_CTX=5
	-DLORA_TCXO_VOLTAGE=1.8f
	-DLORA_FIXED_SX1262=1
	-DLORA_MIN_FREQ_MHZ=863.0f
	-DLORA_MAX_FREQ_MHZ=928.0f
	-DLORA_DEFAULT_FREQ_HZ='"915000000.00"'
	-DLORA_MAX_TX_POWER=0
	-DGPS_SERIAL_RX=39
	-DGPS_SERIAL_TX=38
	-DHELTEC_GNSS_ENABLE=42
	-DHELTEC_GNSS_PPS=41
	-DHELTEC_VEXT_ENABLE=40
	-DHELTEC_BATTERY_ADC=1
	-DSERIAL_RX=-1
	-DSERIAL_TX=-1
	-DBUZZ_PIN=4
	-DHELTEC_USER_BUTTON=0
	-DHELTEC_NEXT_BUTTON=46
	-DBTN_ALIAS='"USER"'
	-DDEEPSLEEP_WAKEUP_PIN=HELTEC_USER_BUTTON
	-DDEEPSLEEP_PIN_ACT=LOW
	-DTXLED=-1
	-DRXLED=-1
	-DIR_TX_PINS='{{"Disabled", -1}, {"GPIO 6", 6}}'
	-DIR_RX_PINS='{{"Disabled", -1}, {"GPIO 6", 6}}'
	-DRF_TX_PINS='{{"Disabled", -1}, {"GPIO 6", 6}}'
	-DRF_RX_PINS='{{"Disabled", -1}, {"GPIO 6", 6}}'
	; Prevent implicit Arduino buses from claiming fixed radio/backlight pins.
	-DARDUINO_DEFAULT_TX=255
	-DARDUINO_DEFAULT_RX=255
	-DARDUINO_DEFAULT_SDA=255
	-DARDUINO_DEFAULT_SCL=255
	-DARDUINO_DEFAULT_SDA1=17
	-DARDUINO_DEFAULT_SCL1=18
	-DARDUINO_DEFAULT_SS=3
	-DARDUINO_DEFAULT_MOSI=15
	-DARDUINO_DEFAULT_MISO=45
	-DARDUINO_DEFAULT_SCK=16
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DREDRAW_DELAY=1

lib_deps =
	${env.lib_deps}

; The kit has no addressable RGB LEDs. Avoid FastLED's unrelated console/
; startup overrides as well as its code and RAM on this fixed hardware.
lib_ignore =
	FastLED
