; Heltec WiFi LoRa 32 V4-R8 with Expansion Kit V2 (high-frequency SX1262).
[env:heltec-v4-expansion-v2]
board = heltec-v4-expansion-v2
board_build.partitions = custom_16Mb.csv
extra_scripts =
	${env.extra_scripts}
	post:boards/heltec-v4-expansion-v2/post_build.py
build_src_filter = ${env.build_src_filter} +<../boards/heltec-v4-expansion-v2>
build_flags =
	${env.build_flags}
	-Iboards/heltec-v4-expansion-v2
	-DHELTEC_V4_EXPANSION_V2
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DREDRAW_DELAY=1

lib_deps =
	${env.lib_deps}

; The kit has no addressable RGB LEDs. Avoid FastLED's unrelated console/
; startup overrides as well as its code and RAM on this fixed hardware.
lib_ignore =
	FastLED
