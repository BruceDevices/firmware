[env:lilygo-t4]
board = esp32
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t4>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/lilygo-t4

	; ==================== Framework Control Flags ====================

	-DDISABLE_ALL_LIBRARY_WARNINGS  ; Silence third-party library compiler warnings

	; ==================== Feature gates ====================
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins
	-DHAS_3_BUTTONS  ; Board navigates with exactly 3 physical buttons

	; ==================== Library Flags ====================


	; ------------------------------------------------------------------ TFT_eSPI display (ILI9341, VSPI)
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=27
	-DTFT_DC=32
	-DTFT_RST=5
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	; ------------------------------------------------------------------ Display setup

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"Lilygo T4 v1.3"'

	; This T4 ILI9341 panel renders correctly without color inversion,
	; unlike most Bruce panels which default to inverted.
	-DDEFAULT_COLOR_INVERTED=0
	-DROTATION=1

	; ------------------------------------------------------------------ Buttons & navigation
	-DBTN_ALIAS='"Sel"'


lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}
