[env:lilka]
board = esp32s3
build_src_filter = ${env.build_src_filter} +<../boards/lilka>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_flags =
	${env.build_flags}
	-Iboards/lilka

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================
	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	; ===== BUTTONS (active LOW, internal pull-ups) =====
	-DHAS_5_BUTTONS=1  ; Board navigates with 5 physical buttons (D-pad style)

	; ==================== Library Flags ====================

	; Second SPI bus (modules on the extension header) -> HSPI peripheral
	-DUSE_HSPI_PORT=1
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_INVERSION_ON
	-DTFT_RGB_ORDER=0
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=46
	-DTFT_RST=-1
	-DTFT_DC=15
	-DTFT_CS=7
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_MISO=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; ===== IR (extension header) =====
	; Default IR-RX pin is set in _setup_gpio() (bruceConfigPins.irRx); the lists let
	; the user pick the pin from the Bruce menu.

	; ==================== Environment Flags ====================


	-DDEVICE_NAME='"Lilka v2.3"'

	; --- migrated from pins_arduino.h ---
	; ===== USB =====
	-DUSB_VID=0x303A
	; ===== SERIAL (on the extension header) + BadUSB + GPS =====
	-DBTN_ALIAS='"A"'
	-DANALOG_BAT_PIN=3
	-DANALOG_BAT_MULTIPLIER=1.33f
	-DANALOG_BAT_MIN_MV=3000
	-DANALOG_BAT_MAX_MV=4200

	; ===== TFT_eSPI (ST7789, 1.69" IPS, 280x240) =====
	-DROTATION=3
	-DIR_TX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 21", 21}, {"GPIO 47", 47}, {"GPIO 48", 48}}'
	-DIR_RX_PINS='{{"GPIO 12", 12}, {"GPIO 13", 13}, {"GPIO 14", 14}, {"GPIO 21", 21}, {"GPIO 47", 47}, {"GPIO 48", 48}}'
	; ===== RF (sub-GHz one-pin modules) - same pin choices as IR =====
	-DRF_TX_PINS=IR_TX_PINS
	-DRF_RX_PINS=IR_RX_PINS
	; ===== LoRa (external module on the extension header) =====
	; Enabled via LoRa_bus in _setup_gpio(). BUSY/IRQ (not in SPIPins) reuse the
	; UART pins 43/44 and stay as macros.
	-DLORA_BUSY=43
	-DLORA_IRQ=44
	; ===== Deep sleep: wake on Select button (GPIO0) =====
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
