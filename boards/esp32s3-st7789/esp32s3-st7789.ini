; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3-st7789]
board = esp32s3-st7789
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/esp32s3-st7789>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-st7789
	-Os
	-DCORE_DEBUG_LEVEL=5

	;Can run USB as HID
	-DUSB_as_HID=1
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL

	;Buttons configuration (active-low boot button on GPIO 0)
	-DHAS_BTN=1
	-DBTN_ALIAS='"OK"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	;-DALLOW_ALL_GPIO_FOR_IR_RF=1 ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	;Infrared Led
	-DIR_TX_PINS='{{"Grove Y", GROVE_SDA}, {"G1", 1}, {"G2", 2}}'
	-DIR_RX_PINS='{{"Grove W", GROVE_SCL}, {"G1", 1}, {"G2", 2}}'
	-DTXLED=40
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Grove Y", GROVE_SDA}, {"G1", 1}, {"G2", 2}}'
	-DRF_RX_PINS='{{"Grove W", GROVE_SCL}, {"G1", 1}, {"G2", 2}}'

	;CC1101 SPI connection pins
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=9
	-DCC1101_SS_PIN=10
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	;NRF24 SPI connection pins
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=16
	-DNRF24_SS_PIN=14
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	;W5500 Ethernet (disabled by default)
	;-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1

	;Lora setup pins (not connected by default)
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=-1
	-DLORA_RST=-1
	-DLORA_DIO0=-1

	;FM Radio
	-DFM_RSTPIN=-1

	;Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	;Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1

	;TFT_eSPI display — ST7789 240x320 SPI
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=10
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_BL=38
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	;Touchscreen — XPT2046 resistive (hardware SPI via CYD28_TouchscreenR)
	-DHAS_TOUCH=1
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=13
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=3
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	;SD Card pins (no SD card by default, set your pins if connected)
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	;Default I2C port (touch + grove)
	-DGROVE_SDA=8
	-DGROVE_SCL=9

	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	;Main SPI bus pins (for CC1101/NRF24/etc)
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

	-DDEVICE_NAME='"ESP32-S3 ST7789"'

lib_deps =
	${env.lib_deps}
