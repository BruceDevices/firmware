; PlatformIO Project Configuration File
; ESP32-S3 + ST7789 2.8" TFT with XPT2046 Touch
;
; TFT Pins (HSPI):  MISO=13, MOSI=11, SCLK=12, CS=10, DC=7, RST=5, BL=38
; Touch (XPT2046):  CS=3, shares HSPI bus (MISO=13, MOSI=11, SCLK=12)
; SD Card:          not connected by default

[env:esp32s3-st7789]
board = esp32s3
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/esp32s3-st7789>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-st7789

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=5  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0

	; ==================== Feature gates ====================

	;Can run USB as HID
	-DUSB_as_HID=1

	;Touchscreen — XPT2046 resistive (hardware SPI via CYD28_TouchscreenR)
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)

	; ==================== Library Flags ====================

	;TFT_eSPI display — ST7789 240x320 SPI
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=10
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_BL=38
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1

	; ==================== Environment Flags ====================
	;Buttons configuration (active-low boot button on GPIO 0)
	-DBTN_ALIAS='"OK"'

	;Infrared Led
	-DIR_TX_PINS='{{"Grove Y", 8}, {"G1", 1}, {"G2", 2}}'
	-DIR_RX_PINS='{{"Grove W", 9}, {"G1", 1}, {"G2", 2}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Grove Y", 8}, {"G1", 1}, {"G2", 2}}'
	-DRF_RX_PINS='{{"Grove W", 9}, {"G1", 1}, {"G2", 2}}'

	-DROTATION=1
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=13
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=3
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	-DDEVICE_NAME='"ESP32-S3 ST7789"'

lib_deps =
	${env.lib_deps}
