[env:lilygo-t-display-s3]
board = esp32s3
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-s3>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-display-s3

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
 	# Used to improve navigation on menus for this device

	;-UARDUINO_USB_CDC_ON_BOOT #Turn off CDC on boot https://github.com/Xinyuan-LilyGO/T-Display-S3
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ==================== Feature gates ====================
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	-DHAS_2_BUTTONS  ; Board navigates with exactly 2 physical buttons
	-DBUTTONS_IDF_COMPONENT=1 ; hal_buttons_poll_2 (src/hal/inputs/buttons.cpp) via lib/ESP32_Button

	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	; ==================== Library Flags ====================

	;SDCARD/CC1101/NRF24/W5500/GROVE_SDA-SCL/TXLED-RXLED/SERIAL_TX-RX values (and the
	;-touch/-mmc/-touch-mmc variants below) now live in _setup_gpio() (interface.cpp),
	;keyed off HAS_TOUCH/USE_SD_MMC, since they varied per env.

	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER=1
	-DTFT_BACKLIGHT_ON=1
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=38
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_WR=8
	-DTFT_RD=9

	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================

	;pins_arduino.h migration - default (non USE_SD_MMC) pin set; the -mmc envs
	;below carry their own equivalent block for when USE_SD_MMC is defined
	-DDEVICE_NAME='"Lilygo T-Display S3"'
	-DINIT_SEQUENCE_3
	-DROTATION=3

	; Battery PIN
	-DPIN_POWER_ON=15
	-DANALOG_BAT_PIN=4

	; Mic

	; Buttons & Navigation
	-DBTN_ALIAS='"OK"'

lib_deps =
	${env.lib_deps}


[env:lilygo-t-display-s3-touch]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}

	; ==================== Feature gates ====================
	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_CST8XX=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"Lilygo T-Display S3 Touch"'

[env:lilygo-t-display-s3-mmc]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}

	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	; ==================== Environment Flags ====================
	-DUSE_SD_MMC=1

lib_ignore =
	SD


[env:lilygo-t-display-s3-touch-mmc]
extends = env:lilygo-t-display-s3
build_flags =
	${env:lilygo-t-display-s3.build_flags}

	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	; ==================== Feature gates ====================
	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_CST8XX=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)

	; ==================== Environment Flags ====================
	-DUSE_SD_MMC=1
	-DDEVICE_NAME='"Lilygo T-Display S3 Touch"'

lib_ignore =
	SD

