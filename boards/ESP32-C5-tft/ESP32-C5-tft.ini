; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[esp32-c5-tft-base]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP32-C5-tft>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5-tft

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================

	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)

	; ==================== Library Flags ====================
	; Common TFT definitions
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=-1
	-DTFT_DC=24
	-DTFT_MISO=2
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=23
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Peripheral settings

	; ILI9341_DRIVER is always defined above on this board, so only the
	; touch-screen branch of the original #ifdef ILI9341_DRIVER / #else
	; applies here (the #else "Buttons" branch is dead code for this board)
	; Touch Screen

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-C5"'

	; ui control buttons
	-DBTN_ALIAS='"OK"'

	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	-DROTATION=1
	-DDEEPSLEEP_WAKEUP_PIN=0

[env:esp32-c5-tft]
extends = esp32-c5-tft-base
build_flags =
	${esp32-c5-tft-base.build_flags}
	; Setup for ILI9341 320x240 (no touch)
	-DILI9341_DRIVER=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTOUCH_CS=1
	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp), shares the display SPI
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	-DCYD28_TouchR_IRQ=-1
	-DCYD28_TouchR_MISO=2
	-DCYD28_TouchR_MOSI=7
	-DCYD28_TouchR_CLK=6
	-DCYD28_TouchR_CS=1

[env:esp32-c5-tft-ST7789-170x320]
extends = esp32-c5-tft-base
build_flags =
	${esp32-c5-tft-base.build_flags}
 	; Setup for ST7789 170x320
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DHAS_3_BUTTONS=1
	-DDEEPSLEEP_WAKEUP_PIN=28

[env:esp32-c5-tft-ST7789-240x320]
extends = esp32-c5-tft-base
build_flags =
	${esp32-c5-tft-base.build_flags}
	; Setup for ST7789 240x320
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
 	-DTFT_INVERSION_ON
	-DTFT_RGB_ORDER=TFT_BGR
	-DHAS_3_BUTTONS=1
	-DDEEPSLEEP_WAKEUP_PIN=28
