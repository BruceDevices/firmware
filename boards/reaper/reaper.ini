[env:reaper]
board = esp32s3
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/reaper>
build_flags =
	${env.build_flags}
	-Iboards/reaper

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================

	; --- migrated from pins_arduino.h ---
	; BAD USB
	-DUSB_as_HID=1
	; MAIN SPI BUS
	; BUTTONS
	-DHAS_6_BUTTONS  ; Board navigates with 6 physical buttons (D-pad style)
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)

	; ==================== Library Flags ====================
    -D USE_HSPI_PORT=1
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MISO=8
	-DTFT_MOSI=18
	-DTFT_SCLK=17
	-DTFT_CS=7
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; RGB LED

	; ==================== Environment Flags ====================
    -DDEVICE_NAME='"Reaper RF"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Default", 2}, {"GPIO 4", 4}, {"GPIO 5", 5}, {"GPIO 42", 42}}'
	-DIR_RX_PINS='{{"Default", 1}, {"GPIO 4", 4}, {"GPIO 5", 5}, {"GPIO 42", 42}}'
    -DRF_TX_PINS='{{"GPIO 4", 4}, {"GPIO 5", 5}, {"GPIO 42", 42}}'
	-DRF_RX_PINS='{{"GPIO 4", 4}, {"GPIO 5", 5}, {"GPIO 42", 42}}'
	-DBTN_ALIAS='"OK"'
	-DLED=2

	; TFT_eSPI display
	-DROTATION=1
	-DRGB_LED=45
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=16
	-DLED_COLOR_STEP=5
	-DPMIC_BQ25896
	; Fuel Gauge
	-DGAUGE_BQ27220
	-DBQ27220_I2C_ADDRESS=0x55
	-DBQ27220_I2C_SDA=47
	-DBQ27220_I2C_SCL=48
	; IO EXPANDER
	-DIO_EXPANDER_AW9523
	-DIO_EXP_GPS=5
	-DIO_EXP_VIBRO=15
	-DIO_EXP_CC_RX=9
	-DIO_EXP_CC_TX=10
	-DIO_EXP_LOGO=0
	-DLORA_BUSY=5
	-DLORA_IRQ=42

lib_deps =
	${env.lib_deps}

