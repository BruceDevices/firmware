; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-deck-pro-epaper]
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-deck-pro-epaper>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-deck-pro-epaper
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_ESP32S3_DEV

	;Features Enabled
	# T-Deck Pro specific
	-DT_DECK_PRO_EPAPER=1

	;FM Radio
	-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713
	-DFM_RSTPIN=-1

	;Microphone - T-Deck Pro may have optional audio module
	;-DMIC_SPM1423=1 ;uncomment to enable Applicable for SPM1423 device
	-DPIN_CLK=-1
	-DI2S_SCLK_PIN=-1
	-DI2S_DATA_PIN=-1
	-DPIN_DATA=-1

	; SERIAL (GPS) dedicated pins - MIA-M10Q GPS
	-DSERIAL_TX=16
	-DSERIAL_RX=17
	-DGPS_SERIAL_TX=16
	-DGPS_SERIAL_RX=17

	;RGB LED - not available on T-Deck Pro
	-DRGB_LED=-1

	;Have RTC Chip - not available on T-Deck Pro
	;-DHAS_RTC=1

	;Speaker - optional on some T-Deck Pro variants (PCM512A)
	;-DHAS_NS4168_SPKR=1 ;uncomment to enable
	-DBCLK=7
	-DWCLK=9
	-DDOUT=8
	-DMCLK=-1

	;Can run USB as HID
	-DUSB_as_HID=1
	-DBAD_TX=GROVE_SDA
	-DBAD_RX=GROVE_SCL

	;Battery ADC read pin
	-DANALOG_BAT_PIN=4

	;Buttons configuration - T-Deck Pro uses keyboard and trackball
	-DHAS_BTN=1
	-DBTN_ALIAS='"Keyboard"'
	-DBTN_PIN=15  ; Keyboard interrupt pin
	-DBTN_ACT=LOW

	;Infrared - not available by default on T-Deck Pro
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	;Radio Frequency (one pin modules) - not available by default
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	;CC1101 SPI connection pins - can be added externally
	;-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=-1
	-DCC1101_MOSI_PIN=-1
	-DCC1101_SCK_PIN=-1
	-DCC1101_MISO_PIN=-1

	;NRF24 SPI connection pins - can be added externally
	;-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=-1
	-DNRF24_SS_PIN=-1
	-DNRF24_MOSI_PIN=-1
	-DNRF24_SCK_PIN=-1
	-DNRF24_MISO_PIN=-1

	;W5500 Ethernet - not available on T-Deck Pro
	;-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=-1
	-DW5500_SCK_PIN=-1
	-DW5500_MISO_PIN=-1
	-DW5500_INT_PIN=-1

	;LoRa setup pins - SX1262 on T-Deck Pro
	-DUSE_SX1262=1
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=3
	-DLORA_RST=4
	-DLORA_DIO0=5
	-DLORA_DIO1=5
	-DLORA_BUSY=6

	;Font sizes, depending on device
	-DFP=1
	-DFM=2
	-DFG=3

	;Screen Setup - E-Paper Display GDEQ031T10
	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	-DUSE_EPAPER=1
	-DROTATION=1
	-DBACKLIGHT=-1  ; E-Paper has no backlight
	-DMINBRIGHT=0

	;TFT_eSPI display - Using EPD driver mode
	-DUSER_SETUP_LOADED=1
	;-DEPD_DRIVER=1  ; E-Paper driver mode
	; Using custom SPI configuration for GDEQ031T10
	-DST7789_DRIVER=1  ; Temporary - will need custom EPD driver
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=240
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_BL=-1
	-DTFT_MISO=-1
	-DTFT_MOSI=33
	-DTFT_SCLK=36
	-DTFT_CS=34
	-DTFT_DC=35
	-DTFT_RST=-1
	-DEPD_BUSY=37  ; E-Paper BUSY pin
	-DTOUCH_CS=-1
	-DTFT_BACKLIGHT_ON=0
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=10000000  ; E-Paper needs slower SPI
	-DSPI_READ_FREQUENCY=10000000
	-DSPI_TOUCH_FREQUENCY=400000

	;SD Card Setup pins - shares SPI with E-Paper
	-DSDCARD_CS=48
	-DSDCARD_SCK=36
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=33

	;Default I2C port - Touch and Keyboard
	-DGROVE_SDA=13
	-DGROVE_SCL=14

	;SPI pins (shared by E-Paper, LoRa, SD Card)
	-DSPI_SCK_PIN=36
	-DSPI_MOSI_PIN=33
	-DSPI_MISO_PIN=-1
	-DSPI_SS_PIN=-1

	-DDEVICE_NAME='"Lilygo T-Deck Pro E-Paper"'

lib_deps =
	${env.lib_deps}
	lewisxhe/SensorLib
	;zinggjm/GxEPD2@^1.5.9  ; E-Paper display library - for future use
