; PlatformIO Project Configuration File for Smoochiee S3 + 2.8" ILI9341
[env:smoochiee-s3-2_8inch-ili9341]
board = smoochiee-s3-2.8inch-ili9341
build_src_filter =${env.build_src_filter} +<../boards/smoochiee-s3-2.8inch-ili9341>
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-s3-2.8inch-ili9341
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DSMOOCHIEE_S3_2_8INCH_ILI9341
	-DUSE_HSPI_PORT=1
	-DDEVICE_NAME='"Smoochiee S3 2.8\" ILI9341"'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0
