[env:esp32-wroom-headless]
extends = env_4mb

board = esp32
board_build.partitions = custom_4Mb_full.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 3932160

monitor_speed = 115200

build_src_filter =
    ${env.build_src_filter}
    +<../boards/esp32-wroom-headless>

build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/esp32-wroom-headless
    -DDISPLAY_DEVICE_HEADLESS_ESP32_4MB
    -DDEVICE_NAME='"Bruce Headless ESP32-WROOM"'
    -DROTATION=0
