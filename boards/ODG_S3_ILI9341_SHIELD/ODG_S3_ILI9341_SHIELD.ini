[env:ODG_S3_ILI9341_SHIELD]
board = ODG_S3_ILI9341_SHIELD
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
build_src_filter = ${env.build_src_filter} +<../boards/ODG_S3_ILI9341_SHIELD>
build_flags =
	${env.build_flags}
	-Iboards/ODG_S3_ILI9341_SHIELD
	-DODG_S3_ILI9341_SHIELD=1
	-DDEVICE_NAME='"ODG S3 ILI9341 Shield"'
	-DHAS_SCREEN=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DROTATION=1
	-DTFT_MOSI=45
	-DTFT_MISO=46
	-DTFT_SCLK=3
	-DTFT_CS=14
	-DTFT_DC=47
	-DTFT_RST=21
	-DTFT_BL=-1
	-DBACKLIGHT=-1
	-DSMOOTH_FONT=1
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_TOUCH=1
	-DTOUCH_CS=1
	-DTOUCH_CLK=42
	-DTOUCH_MOSI=2
	-DTOUCH_MISO=41
	-DTOUCH_IRQ=-1
	-DODG_TOUCH_XPT2046_SEPARATE_SPI=1
	-DHAS_BTN=0
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1
	-DODG_SD_DISABLED=1
	-DODG_DHT11_DISABLED=1
	-DODG_POT_DISABLED=1
	-DODG_OLED_DISABLED=1
	-DODG_CLASSIC_UART_DISABLED=1
	-DODG_RF_DISABLED=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
	${env.lib_deps}
