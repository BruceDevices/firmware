[env:NewDeviceModel]
platform = espressif32
board = esp32dev
framework = arduino
; สั่งให้ดึงโค้ดฝั่งบอร์ดทั่วไปมาคอมไพล์ (อ้างอิงตามโครงสร้างโฟลเดอร์ของ Bruce)
build_src_filter = ${env.build_src_filter} +<../boards/esp32dev>

; กำหนดโหมดแฟลชและขนาด Partition สำหรับ ESP32 4MB
board_build.flash_mode = dio
board_build.partitions = custom_4Mb.csv

build_flags =
	${env.build_flags}
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDEVICE_NAME='"Bruce DevKitC"'
	
	; --- การตั้งค่าหน้าจอ ST7789 ขนาด 1.47 นิ้ว (ผ่าน TFT_eSPI) ---
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=172
	-DTFT_HEIGHT=320
	; เปิดใช้งานคำสั่งกลับสีและปรับตำแหน่งพิกเซล (ขึ้นอยู่กับล็อตจอแบรนด์นั้นๆ)
	-DCONFIG_TFT_INVERSION_ON=1 
	
	; --- การแมปขาหน้าจอ SPI (ตัวอย่างขาที่นิยมต่อใช้งานจริงบน DevKitC 30 pin) ---
	-DTFT_MOSI=23   ; ขา SDA ของจอ ต่อเข้า MOSI (VSPI)
	-DTFT_SCLK=18   ; ขา SCL ของจอ ต่อเข้า SCLK (VSPI)
	-DTFT_CS=5      ; ขา CS ของจอ
	-DTFT_DC=2      ; ขา DC / RS ของจอ
	-DTFT_RST=4     ; ขา RESET ของจอ
	-DTFT_BL=21     ; ขา Backlight (ถ้าไม่ใช้ ให้ลบบรรทัดนี้ออกแล้วต่อขา BL ของจอเข้า 3.3V ตรงๆ)

	; --- ปรับแก้ขาฟังก์ชันอื่นๆ ให้เข้ากับ ESP32 Classic ---
	-DBUZZ_PIN=25    ; เปลี่ยนจากขา 44 มาเป็นขา 25 (หรือขาอื่นๆ ที่ว่าง)
	
	; ปรับเปลี่ยนเลขขา IR และ RF เป็น GPIO จริงที่คุณต้องการเชื่อมต่อ
	-DIR_TX_PINS='{{"GPIO 12", 12}}'
	-DIR_RX_PINS='{{"GPIO 13", 13}}'
	-DRF_TX_PINS='{{"GPIO 14", 14}}'
	-DRF_RX_PINS='{{"GPIO 27", 27}}'

; ลบไลบรารี XPowersLib ออกเรียบร้อยแล้ว
lib_deps =
	${env.lib_deps}
