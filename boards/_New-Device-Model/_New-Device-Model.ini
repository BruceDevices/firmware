; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:NewDeviceModel]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; Flash/PSRAM wiring. `board = esp32s3` above only picks the generic MCU JSON from
; boards/_jsonfiles/; everything that differs on the real device is overridden here.
;   qio_qspi -> no PSRAM, or quad (QSPI) PSRAM   <- safest default
;   qio_opi  -> octal (OPI) PSRAM (N16R8 modules and friends)
; Getting this wrong makes the board boot-loop trying to init a PSRAM chip that
; isn't populated. When the device does have PSRAM, also add -DBOARD_HAS_PSRAM below.
board_build.arduino.memory_type = qio_qspi
;board_build.flash_mode = qio
;board_build.f_flash = 80000000L
;board_upload.speed = 921600

; MANDATORY: compiles this folder's interface.cpp into the firmware. Without this line
; interface.cpp is never built, the weak no-op defaults in src/main.cpp win, and the
; board boots with no inputs and no pin setup at all (it still links, so it is an easy
; mistake to miss). Keep the path in sync with the folder name.
build_src_filter = ${env.build_src_filter} +<../boards/_New-Device-Model>

build_flags =
	${env.build_flags}
	-Iboards/_New-Device-Model

	; ==================== Framework Control Flags ====================
	; Flags that configure the Arduino/ESP-IDF framework itself, not this
	; app's features.
	-DCORE_DEBUG_LEVEL=1          ; Arduino core log verbosity (0=none .. 5=verbose)
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0 (used only on ESP32-S3 to make Serial Commands work)
	-DARDUINO_USB_MODE=1          ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC, required alongside ARDUINO_USB_CDC_ON_BOOT)
	;-DBOARD_HAS_PSRAM=1          ; Device has PSRAM (must match board_build.arduino.memory_type
	                              ; above). Also selects the larger FreeRTOS task stacks in
	                              ; include/precompiler_flags.h and the PSRAM-only code paths.
	;-DDISABLE_ALL_LIBRARY_WARNINGS ; Silences TFT_eSPI's driver/pin sanity #warnings
	; Task stack sizes -- only set these when the defaults picked by BOARD_HAS_PSRAM in
	; include/precompiler_flags.h don't fit this device (stack overflow, or wasted RAM).
	;-DINPUT_HANDLER_TASK_STACK_SIZE=4096  ; task that runs InputHandler() (see interface.cpp)
	;-DSERIAL_CMDS_TASK_STACK_SIZE=8192
	;-DINTERPRETER_TASK_STACK_SIZE=16384
	;-DSSH_TASK_STACK_SIZE=16384
	;-DSAFE_STACK_BUFFER_SIZE=4096

	; ==================== Feature gates ====================
	; Each of these turns on (or, commented, leaves off) a whole optional
	; subsystem at compile time. Uncomment the ones this real device has,
	; and keep their companion pin defines in sync (see Environment Flags).
	;-D HAS_TOUCH=1					; Board has a touchscreen controller (needs TOUCH_CS and, for capacitive panels, the touch driver flags below)
	;-D HAS_RGB_LED=1				; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	;-D HAS_ENCODER_LED				; Has LEDs on the Encoder wheel
	;-D HAS_RTC=1					; Board has an RTC chip (needs RTC_SDA/RTC_SCL)
	;-D HAS_RTC_PCF85063A=1			; using PCF85063A RTC Chip
	;-D HAS_RTC_BM8563=1			; using BM8563 RTC chip
	;-D HAS_SPEAKER=1				; Board has an I2S speaker (wiring goes in _setup_gpio(), see interface.cpp)
	;-D HAS_MICROPHONE=1			; Board has a microphone (wiring + type go in _setup_gpio(), see interface.cpp)
	;-D USB_as_HID=1				; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)
	;-D LITE_VERSION=1				; Trims features to fit smaller flash (M5Launcher-compatible builds)
	;-D ALLOW_ALL_GPIO_FOR_IR_RF=1	; Let the user pick any GPIO (1-44) for IR/RF instead of only the curated IR_TX_PINS/RF_TX_PINS list
	;-D DISABLE_INTERPRETER=1		; Disable JavaScript Interpreter
	;-D ENABLE_RAM_LOGGING=1		; Enable RAM Logging on Serial
	;-D REMOVE_RFID_HW_INTERFACE=1	; Remove RFID interface from menu


	; ==================== Library Flags (display) ====================

	# Display Driver (Must add the library on `lib_deps`), ArduinoGFX is lib default, doesn't need any flag
	# Refer to `lib\DisplayDrivers\README.md` to set the display accordingly
	;-D USE_M5GFX=1       # to use M5GFX library to drive the display using M5.Display.<>() functions
	;-D USE_GXEPD2=1      # to use GxEPD2 display library
	;-D USE_TFT_ESPI=1    # to use TFT_eSPI library
	;-D USE_LOVYANGFX=1   # to use Lovyan GFX driver
	;-D USE_EPD_PAINTER=1 # to use EPD_PAINTER
	;-D USE_DUMMY_TFT=1   # no display at all, every draw call is a no-op

	; TFT_eSPI "User_Setup" config: these values are read directly by the
	; TFT_eSPI library, not by Bruce's own code.
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1         ; Tells TFT_eSPI to use this build's -D config instead of its bundled User_Setup.h
	-DUSE_HSPI_PORT=1             ; Drive the display on the ESP32 HSPI peripheral
	-DST7789_2_DRIVER=1           ; Panel driver chip
	-DTFT_RGB_ORDER=1             ; Colour order sent to the panel (RGB vs BGR)
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1          ; Logic level that turns the backlight on
	-DTFT_BL=38                   ; Backlight control pin
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1                 ; No touch controller on this board (-1 = absent)
	-DSMOOTH_FONT=1               ; Enable TFT_eSPI anti-aliased font rendering
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================

	# Battery pin, if using voltage divider
	-D ANALOG_BAT_PIN=38
	;-D ANALOG_BAT_MULTIPLIER=2.0f ; Voltage Multiplier, default is 2.0f
	;-D ANALOG_BAT_MIN_MV=3000     ; Min milli Volt value for battery (def 3300)
	;-D ANALOG_BAT_MAX_MV=4200     ; Max milli Volt value for battery (def 4100)

	# Power HAL (src/hal/power) -- charger IC and fuel gauge, selected by
	# chip. Board fills a DevicePmic/DeviceGauge (pins + I2C address) in
	# _setup_gpio() and calls hal_pmic_init()/hal_gauge_init() -- see
	# boards/lilygo-t-embed-cc1101 for a worked example. These are the only
	# chips the shared HAL implements today -- a different PMIC/gauge
	# (AXP2101, AXP192, SY6970, MAX17048, ...) stays board-specific in
	# interface.cpp until HAL support for it is added, see src/hal/README.md.
	;-D PMIC_BQ25896=1  # BQ25896 charger via XPowersLib (src/hal/power/pmic.cpp)
	;-D GAUGE_BQ27220=1 # BQ27220 fuel gauge (src/hal/power/gauge.cpp)

	# Navigation layout. At most ONE HAS_x_BUTTON(S) flag -- they are mutually
	# exclusive, and include/precompiler_flags.h already derives the extra ones a
	# layout implies (HAS_6_BUTTONS -> HAS_5_BUTTONS, HAS_4_BUTTONS/HAS_2_BUTTONS
	# -> HAS_3_BUTTONS) for the on-screen keyboard.
	# Everything else combines freely: buttons + HAS_TOUCH + HAS_KEYBOARD +
	# HAS_ENCODER on the same board is fine (see lilygo-t-lora-pager for
	# encoder + keyboard, marauder-touch for encoder + touch). InputHandler()
	# just calls one poll per source.
	# The logical-button-to-pin order of each layout is documented in
	# src/hal/device.h (DeviceButtons) and in interface.cpp here.
	;-D HAS_1_BUTTON=1  # 1 button only (single, double and long pulse on one btn)
						# NexPress:  Short single pulse
						# PrevPress: Short double pulse (300ms interval window)
						# SelPress:  Long pulse (550ms)
						# EscPress:  Extra long pulse (1200ms)
	;-D HAS_2_BUTTONS=1 # 2 buttons (single, double and long pulse on two btns)
						# NextPress: Short single pulse on Btn1
						# SelPress:  Long pulse (600ms) on Btn1
						# PrevPress: Short single pulse on Btn2
						# EscPress:  Long pulse (600ms) on Btn2
	;-D BUTTONS_IDF_COMPONENT=1 # REQUIRED together with HAS_2_BUTTONS: selects the
								# ESP-IDF `button` component backend used by
								# hal_buttons_poll_2(). lib/ESP32_Button is vendored,
								# so no lib_deps entry is needed.
	;-D HAS_3_BUTTONS=1 # 3 buttons (Prev, Next, Sel; Prev+Next = EscPress)
	;-D HAS_4_BUTTONS=1 # 4 buttons (Prev, Next, Sel, Esc). Reuses the 3-button
						# on-screen keyboard layout (include/precompiler_flags.h)
	;-D HAS_5_BUTTONS=1 # 5 buttons (Prev, Next, Up, Down, Sel; Prev+Next = Esc)
	;-D HAS_6_BUTTONS=1 # 6 buttons (Prev, Next, Up, Down, Sel, Esc)
	;-D HAS_ENCODER=1   # Rotary encoder + Sel button (+ optional Esc button).
						# lib/RotaryEncoder is vendored, no lib_deps entry needed.
	;-D HAS_KEYBOARD=1  # Has a physical keyboard -- there is no shared HAL for this,
						# keyboard scanning stays board-specific in interface.cpp
						# (see m5stack-cardputer, lilygo-t-deck, lilygo-t-lora-pager)

	# Touch HAL (src/hal/inputs/touch.cpp) -- pick exactly ONE, by controller
	# chip (same pattern as PMIC_*/GAUGE_*). The board fills a DeviceTouch
	# (pins + rotation-indexed Mirror/Swap arrays) in _setup_gpio() and calls
	# hal_touch_init()/hal_touch_read() -- see interface.cpp here, or
	# boards/phantom (XPT2046) / boards/lilygo-t-deck (GT911) for real boards.
	# All of these drivers are vendored in lib/ (SensorLib, CYD-touch), so
	# none of them needs a lib_deps entry. Per-chip notes: src/hal/README.md.
	;-D TOUCH_CTRL_XPT2046=1 # CYD28_TouchscreenR (SPI, resistive) -- also set
							  # the CYD28_TouchR_* pins below
	;-D TOUCH_CTRL_GT911=1   # SensorLib TouchDrvGT911 (I2C, capacitive)
	;-D TOUCH_CTRL_CST8XX=1  # SensorLib TouchDrvCSTXXX (I2C, CST816/CST820/
							  # CST716/CST226/CST92xx family)
	;-D TOUCH_CTRL_FT6X36=1  # SensorLib TouchDrvFT6X36 (I2C, whole FT6206/
							  # FT6236/FT6336(U)/FT3267/FT5336/FT3068 family)
	;-D TOUCH_CTRL_GT9895=1  # SensorLib TouchDrvGT9895 (I2C). This chip doesn't
							  # report its own resolution, so the board must also
							  # set DeviceTouch.raw_width/raw_height
	;-D TOUCH_CTRL_HI8561=1  # SensorLib TouchDrvHI8561 (I2C)

	# Set XPT2046 Resistive Touchscreen pinouts for the library
	;-D HAS_RESISTIVE_TOUCH=1 # when using XPT2046 to enable calibration
	;-D CYD28_TouchR_IRQ=36
	;-D CYD28_TouchR_MISO=12
	;-D CYD28_TouchR_MOSI=13
	;-D CYD28_TouchR_CLK=14
	;-D CYD28_TouchR_CS=33




	; Board-specific pins, labels and constants consumed directly by Bruce's
	; own code (main.cpp, mykeyboard.cpp, ir/rf/led modules, etc).
	; NOTE: the GPIOs for SD card, CC1101, NRF24, PN532/RC522, W5500, LoRa, I2C,
	; UART, GPS, speaker, mic and buzzer are NOT -D flags -- they are assigned to
	; bruceConfigPins.* in interface.cpp's _setup_gpio(), so the user can re-map
	; them at runtime from Config > Set Device pins. See interface.cpp.
	-D DEVICE_NAME='"New Device Name"'  ; Device Info screen, serial `device` cmd, JS getBoard()

	; -- RGB LED (HAS_RGB_LED) --
	-DRGB_LED=21                  ; Data pin
	;-DRGB_LED_CLK=45             ; Clock pin, only for clocked strips (APA102/SK9822)
	-DLED_TYPE=WS2812B            ; FastLED chipset name (WS2812B, APA102, SK6812, ...)
	-DLED_ORDER=GRB               ; FastLED colour order (GRB, RGB, BGR, ...)
	-DLED_COUNT=1                 ; Number of LEDs on the strip/ring
	-DLED_COLOR_STEP=5            ; Hue step of the colour-picker UI (smaller = finer)
	; -- Buttons --
	-DBTN_ALIAS='"Ok"'            ; Label shown in the UI for the main select button
	; -- Power off / deep sleep (goToDeepSleep(), src/core/mykeyboard.cpp) --
	; Without DEEPSLEEP_WAKEUP_PIN the generic "Deep Sleep" entry just shows
	; "Not available"; a board needing more than an ext0/ext1 wake-up (PMIC power
	; off, power-enable pin, ...) overrides powerOff() in interface.cpp instead.
	;-DDEEPSLEEP_WAKEUP_PIN=0     ; GPIO that wakes the device up (default -1 = disabled)
	;-DDEEPSLEEP_PIN_ACT=LOW      ; Level of that GPIO while pressed (default LOW)
	; -- Infrared --
	-DIR_TX_PINS='{{"M5 IR Mod", 1}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 2}, {"Pin 1", 1}, {"Pin 2", 2}}'

	; -- Radio Frequency (one-pin modules) --
	-DRF_TX_PINS='{{"M5 RF433T", 1}, {"Pin 1", 1}, {"Pin 2", 2}}'
	-DRF_RX_PINS='{{"M5 FR433R", 2}, {"Pin 1", 1}, {"Pin 2", 2}}'
	;-DLED_ON=1                   ; Level that lights the IR TX LED (default 1)
	;-DLED_OFF=0                  ; Level that turns the IR TX LED off (default 0)
	; -- RTC (HAS_RTC) --
	;-DRTC_SDA=21                 ; I2C pins of the RTC chip when it isn't on sys_i2c
	;-DRTC_SCL=22
	; -- Fuel gauge (GAUGE_BQ27220) when it isn't on the default Wire pins --
	;-DBQ27220_I2C_ADDRESS=0x55
	;-DBQ27220_I2C_SDA=8
	;-DBQ27220_I2C_SCL=18
	; -- Misc --
	;-DUSE_BOOST=1                ; Board can power 5V accessories from the PMIC boost (OTG)
	;-DDEFAULT_COLOR_INVERTED=1   ; Panel needs inverted colours out of the box
	;-DKB_HID_EXIT_MSG='"Press Fn+Esc to exit"' ; Hint shown by the BadUSB ducky typer
	; -- SD card over SDMMC instead of SPI --
	; Also needs the fatfs include paths and `lib_ignore = SD`; copy the whole
	; `-mmc` env block from boards/lilygo-t-display-s3/lilygo-t-display-s3.ini.
	;-DUSE_SD_MMC=1
	; -- UI font sizes --
	; -DFP=1		; Set only if different of normal
	; -DFM=2		; Set only if different of normal
	; -DFG=3		; Set only if different of normal
	; -- Screen orientation --
	-DROTATION=1                  ; 0/2 = portrait, 1/3 = landscape. _setup_gpio() can
	                              ; override it via bruceConfigPins.rotation.

; Only the display libraries need a lib_deps entry here -- everything else a board
; may use (SensorLib, RotaryEncoder, ESP32_Button, CYD-touch, XPowersLib, RTC,
; TFT_eSPI) is vendored in lib/, and FastLED/RadioLib/etc are already in the root
; platformio.ini. Uncomment the line matching the display driver flag chosen above.
lib_deps =
	${env.lib_deps}
	;moononournation/GFX Library for Arduino @ ^1.5.5
	;lovyan03/LovyanGFX @ ^1.2.7
	;m5stack/M5Unified @ ^0.2.11        + m5stack/M5GFX @ ^0.2.18
	;https://github.com/tonywestonuk/EPD_Painter  ; + adafruit/Adafruit GFX Library @ ^1.12.1
	;zinggjm/GxEPD2 @ ^1.6.4                      ; + adafruit/Adafruit GFX Library @ ^1.12.1
