; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare-c5-tft]
board = esp32c5
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =${env.build_src_filter} +<../boards/waveshare-c5-tft>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-c5-tft

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================

	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	-DHAS_5_BUTTONS  ; Board navigates with 5 physical buttons (D-pad style)

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=172
	-DTFT_HEIGHT=320
	; Common TFT definitions
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=25
	-DTFT_RST=-1
	-DTFT_DC=24
	-DTFT_MISO=9
	-DTFT_MOSI=8
	-DTFT_SCLK=10
	-DTFT_CS=23
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-C5"'

	; ---- migrated from pins_arduino.h ----
	; BUILTIN_LED can be used in new Arduino API digitalWrite() like in Blink.ino
	; RGB_BUILTIN and RGB_BRIGHTNESS can be used in new Arduino API rgbLedWrite()
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	; SPI
	-DROTATION=1
	-DBTN_ALIAS='"OK"'
	-DDEEPSLEEP_WAKEUP_PIN=28

