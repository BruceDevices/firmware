; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:lilygo-t-display-S3-pro]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-display-s3-pro>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-display-s3-pro

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)

	; ==================== Feature gates ====================
	;Microphone
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)
	;Speaker to run music, compatible with NS4168
	-DHAS_SPEAKER=1  ; Board has an I2S speaker (wiring set in interface.cpp _setup_gpio)
	;Can run USB as HID
	-DUSB_as_HID=1  ;uncomment to enable

	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_CST8XX=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_3_BUTTONS  ; Board navigates with exactly 3 physical buttons

	; ==================== Library Flags ====================
	-DSMOOTH_FONT=1
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7796_DRIVER  # Configure all registers

	-DTFT_WIDTH=222
	-DTFT_HEIGHT=480
	-DCGRAM_OFFSET  # Library will add offsets required
	-DTFT_RGB_ORDER=TFT_BGR  # Colour order Blue-Green-Red
	-DTFT_INVERSION_ON
	-DTFT_MISO=8
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_CS=39
	-DTFT_DC=9
	-DTFT_RST=47
	-DTFT_BL=48
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DTOUCH_CS=9

	; ==================== Environment Flags ====================
	-DRTC_SDA=5
	-DRTC_SCL=6

	;Buttons configuration
	-DBTN_ALIAS='"Mid"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

    -DROTATION=3  # Portrait, 3 to landscape

	-DDEVICE_NAME='"Lilygo T-Display S3 Pro"'

