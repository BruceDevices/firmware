; JC4827W543 Board Configuration
; 4.3" ESP32-S3 Display with NV3041A driver (480x270)

[env:JC4827W543]
board = esp32-s3-devkitc
board_build.partitions = custom_8Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    ${env.build_flags}
    -DJC4827W543=1
    -DDEVICE_NAME='"JC4827W543 4.3"'
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5
    -DBAD_TX=21
    -DBAD_RX=22
    -DBAD_ALT=1
