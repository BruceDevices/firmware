; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   https://docs.platformio.org/page/projectconf.html

##################################### JC4827W543 MODELS ################################################
; JC4827W543 - 4.3" ESP32-S3 Display with NV3041A driver (480x270)
; https://github.com/profi-max/JC4827W543_4.3inch_ESP32S3_board

[JC4827W543_base]
extends = env
board = JC4827W543
monitor_speed = 115200
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/JC4827W543>
build_flags =
    ${env.build_flags}

    -DJC4827W543=1   ; key for new device
                    ; mykeyboard.cpp: need map buttons and/or touchscreen
                    ; settings.cpp: brightness control
                    ; main.cpp: startup

    ; Features Enabled (uncomment as needed)
    
    ; FM Radio (requires Si4713 module)
    ; -DFM_SI4713=1
    ; -DFM_RSTPIN=40
    
    ; Microphone (optional SPM1423)
    ; -DMIC_SPM142CH0.1=1
    -DPIN_CLK=-1
    -DI2S_SCLK_PIN=-1
    -DI2S_DATA_PIN=-1
    -DPIN_DATA=-1

    ; RGB LED
    ; -DHAS_RGB_LED=1
    -DRGB_LED=-1

    ; RTC Chip
    ; -DHAS_RTC=1

    ; Speaker NS4168
    ; -DHAS_NS4168_SPKR=1
    -DBCLK=-1
    -DWCLK=-1
    -DDOUT=-1

    ; USB HID
    ; -DUSB_as_HID=1
    -DBAD_TX=GROVE_SDA
    -DBAD_RX=GROVE_SCL

    ; GPS Serial
    -DSERIAL_TX=1
    -DSERIAL_RX=3
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    ; Battery ADC
    ; -DBAT_PIN=10

    ; Physical buttons
    -DHAS_BTN=1
    -DBTN_ALIAS='"Ok"'
    -DBTN_PIN=0

    ; IR
    -DIR_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
    -DIR_RX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}, {"Pin 35", 35}}'
    -DTXLED=22
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; RF (CC1101)
    -DRF_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
    -DRF_RX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}, {"Pin 35", 35}}'

    ; CC1101 SPI (optional)
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=22
    -DCC1101_SS_PIN=27
    -DCC1101_MOSI_PIN=SPI_MOSI_PIN
    -DCC1101_SCK_PIN=SPI_SCK_PIN
    -DCC1101_MISO_PIN=SPI_MISO_PIN

    ; NRF24L01+ (optional)
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=22
    -DNRF24_SS_PIN=27
    -DNRF24_MOSI_PIN=SPI_MOSI_PIN
    -DNRF24_SCK_PIN=SPI_SCK_PIN
    -DNRF24_MISO_PIN=SPI_MISO_PIN

    ; W5500 Ethernet (optional)
    -DUSE_W5500_VIA_SPI
    -DW5500_SS_PIN=27
    -DW5500_MOSI_PIN=SPI_MOSI_PIN
    -DW5500_SCK_PIN=SPI_SCK_PIN
    -DW5500_MISO_PIN=SPI_MISO_PIN
    -DW5500_INT_PIN=22

    ; Font sizes
    -DFP=1
    -DFM=2
    -DFG=3

    ; Screen Setup
    -DHAS_SCREEN=1
    -DROTATION=1
    -DBACKLIGHT=1
    -DMINBRIGHT=160

    ; NV3041A Display via QSPI
    -DUSER_SETUP_LOADED=1
    -DNV3041A_DRIVER=1
    -DTFT_WIDTH=480
    -DTFT_HEIGHT=270

    ; QSPI TFT pins
    -DTFT_BL=1
    -DTFT_RST=-1

    ; Touch controller (enable for resistive touch via XPT2046)
    -DHAS_TOUCH=1
    -DUSE_TFT_eSPI_TOUCH=1
    -DXPT2046_CS=38
    -DXPT2046_IRQ=3

    ; SD Card
    -DSDCARD_CS=5
    -DSDCARD_SCK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=23

    ; Brightness control
    -DTFT_BRIGHT_CHANNEL=0
    -DTFT_BRIGHT_Bits=8
    -DTFT_BRIGHT_FREQ=5000

    ; Default I2C port
    -DGROVE_SDA=21
    -DGROVE_SCL=22

    ; SPI bus
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5

lib_deps =
    ${env.lib_deps}

lib_ignore =
    ${env_4mb.lib_ignore}

##################################### JC4827W543 BUILDS #########################################
[env:JC4827W543]
extends = JC4827W543_base
build_flags =
    ${JC4827W543_base.build_flags}
    -DDEVICE_NAME='"JC4827W543 4.3" ESP32-S3"'