; JC4827W543 4.3" ESP32-S3 Board Configuration
;
; Board: JC4827W543 4.3" TFT with ESP32-S3 (WROOM-1-N4R8)
; Display: 4.3" TFT 480x272, NV3041A driver
; Touch: XPT2046 resistive touch

[env:jc4827w543]
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_build.partitions = custom_4Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/jc4827w543>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/jc4827w543

	; Board identification
	-DDEVICE_NAME='"JC4827W543 4.3\" ESP32-S3"'

	; Display settings
	-DHAS_SCREEN=1
	-DROTATION=0
	-DMINBRIGHT=1

	; TFT_eSPI for NV3041A
	-DUSER_SETUP_LOADED=1
	-DNV3041A_DRIVER=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=272
	-DTFT_CS=45
	-DTFT_RST=-1
	-DTFT_DC=2
	-DTFT_BL=1
	-DTFT_BACKLIGHT_ON=1

	; Display data pins (8-bit parallel)
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=48
	-DTFT_D4=21
	-DTFT_D5=47
	-DTFT_D6=46
	-DTFT_D7=6

	; Display control
	-DTFT_WR=7
	-DTFT_RD=8

	; SPI frequencies
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Touchscreen (XPT2046 resistive)
	-DHAS_TOUCH=1
	-DUSE_TFT_eSPI_TOUCH=1
	-DTOUCH_CS=38
	-DTOUCH_SCK=12
	-DTOUCH_MISO=13
	-DTOUCH_MOSI=11
	-DTOUCH_INT=3

	; I2C for future expansion (GT911 capacitive touch alternative)
	-DGROVE_SDA=8
	-DGROVE_SCL=4

	; Serial pins
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; SPI bus (for external radios)
	-DSPI_SCK_PIN=47
	-DSPI_MOSI_PIN=21
	-DSPI_MISO_PIN=48
	-DSPI_SS_PIN=45

	; CC1101 SPI radio
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=10
	-DCC1101_SS_PIN=9
	-DCC1101_MOSI_PIN= SPI_MOSI_PIN
	-DCC1101_SCK_PIN= SPI_SCK_PIN
	-DCC1101_MISO_PIN= SPI_MISO_PIN

	; NRF24L01 radio
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=6
	-DNRF24_SS_PIN=7
	-DNRF24_MOSI_PIN= SPI_MOSI_PIN
	-DNRF24_SCK_PIN= SPI_SCK_PIN
	-DNRF24_MISO_PIN= SPI_MISO_PIN

	; W5500 Ethernet
	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN= SPI_MOSI_PIN
	-DW5500_SCK_PIN= SPI_SCK_PIN
	-DW5500_MISO_PIN= SPI_MISO_PIN
	-DW5500_INT_PIN=-1

	; Buttons - touchscreen primary, one button for OK
	-DHAS_3_BUTTONS=1
	-DBTN_ALIAS='"OK"'
	-DSEL_BTN=14
	-DUP_BTN=-1
	-DDW_BTN=-1
	-DBTN_ACT=LOW

	; IR/RF pins
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DIR_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DIR_RX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}, {"Pin 35", 35}}'
	-DRF_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DRF_RX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}, {"Pin 35", 35}}'

	; LED
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; USB HID
	-DUSB_as_HID=1

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Brightness control
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_BITS=8
	-DTFT_BRIGHT_FREQ=5000

	; Power pin
	-DPIN_POWER_ON=5

lib_deps =
	${env.lib_deps}
	${env_4mb.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}