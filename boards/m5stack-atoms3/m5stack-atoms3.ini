; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; M5Stack AtomS3 - ESP32-S3FN8 (8MB flash, no PSRAM), 0.85" 128x128 LCD,
; single front button (G41), internal IR LED (G4).
; Panel, brightness and power are handled by M5Unified/M5GFX auto-detection.

[env:m5stack-atoms3]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_qspi ; AtomS3 has no PSRAM
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-atoms3>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-atoms3

	; ==================== Framework Control Flags ====================
	-D CORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)

	; ==================== Feature gates ====================
	; Single front button under the LCD (G41, active LOW, internal pull-up):
	; click -> Next, double click -> Prev, 550ms -> Sel, 1200ms -> Esc
	-D HAS_1_BUTTON=1

	;Can run USB as HID
	-D USB_as_HID=1

	; ==================== Library Flags ====================

	-D USE_M5GFX=1
	-D TFT_WIDTH=128
	-D TFT_HEIGHT=128

	; ==================== Environment Flags ====================
	-DM5STACK

	-D DEVICE_NAME='"M5AtomS3"'
	-D ROTATION=0
	-D BTN_ALIAS='"SEL"'

	; Internal IR LED is on G4; everything else is the free bottom-header pins.
	; No spaces inside the value: the build_flags parser splits on them.
	-D IR_TX_PINS='{{"Internal",4},{"G1",1},{"G2",2},{"G5",5},{"G6",6},{"G7",7},{"G8",8}}'
	-D IR_RX_PINS='{{"G1",1},{"G2",2},{"G5",5},{"G6",6},{"G7",7},{"G8",8}}'

	;Radio Frequency (one pin modules) pin setting
	-D RF_TX_PINS='{{"G1",1},{"G2",2},{"G5",5},{"G6",6},{"G7",7},{"G8",8}}'
	-D RF_RX_PINS='{{"G1",1},{"G2",2},{"G5",5},{"G6",6},{"G7",7},{"G8",8}}'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified

lib_ignore =
	TFT_eSPI
