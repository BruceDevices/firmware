; PlatformIO Project Configuration File for ESP32-S3 DevKit
; Includes all Bruce offensive security features

[env:esp32s3-devkit]
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32s3-devkit>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-devkit
	-DDEVICE_NAME='"ESP32-S3 DevKit"'
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	; Display Configuration (SH1106 OLED 128x64)
	-DHAS_SCREEN=1
	-DROTATION=0
	-DUSE_OLED_SH1106=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=64
	-DOLED_SDA=8
	-DOLED_SCL=9
	
	; Button Configuration (6 Navigation Buttons)
	-DHAS_BTN=1
	-DUP_BTN=35
	-DDW_BTN=36
	-DLEFT_BTN=37
	-DRIGHT_BTN=38
	-DSEL_BTN=39
	-DBACK_BTN=40
	-DBTN_ACT=LOW
	
	; I2C Configuration (OLED)
	-DSYS_I2C_SDA=8
	-DSYS_I2C_SCL=9
	-DGROVE_SDA=8
	-DGROVE_SCL=9
	
	; Serial Configuration
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	
	; SPI Configuration (for RF/RFID modules)
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	
	; CC1101 Sub-Ghz Module (SPI)
	-DUSE_CC1101_VIA_SPI=1
	-DCC1101_GDO0_PIN=1
	-DCC1101_SS_PIN=${DSPI_SS_PIN}
	-DCC1101_MOSI_PIN=${DSPI_MOSI_PIN}
	-DCC1101_SCK_PIN=${DSPI_SCK_PIN}
	-DCC1101_MISO_PIN=${DSPI_MISO_PIN}
	
	; NRF24 2.4GHz Module (SPI)
	-DUSE_NRF24_VIA_SPI=1
	-DNRF24_CE_PIN=2
	-DNRF24_SS_PIN=${DSPI_SS_PIN}
	-DNRF24_MOSI_PIN=${DSPI_MOSI_PIN}
	-DNRF24_SCK_PIN=${DSPI_SCK_PIN}
	-DNRF24_MISO_PIN=${DSPI_MISO_PIN}
	
	; Infrared (TX/RX)
	-DTXLED=3
	-DRXLED=4
	-DIR_TX_PINS='{{"GPIO3",3},{"GPIO4",4},{"GPIO5",5}}'
	-DIR_RX_PINS='{{"GPIO2",2},{"GPIO14",14},{"GPIO21",21}}'
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	
	; Radio Frequency (RF433)
	-DRF_TX_PINS='{{"GPIO5",5},{"GPIO6",6},{"GPIO7",7}}'
	-DRF_RX_PINS='{{"GPIO14",14},{"GPIO21",21},{"GPIO26",26}}'
	
	; RFID/NFC (PN532 via I2C or SPI)
	; Uncomment one configuration:
	; I2C Mode:
	-DPN532_SDA=8
	-DPN532_SCL=9
	; OR SPI Mode (uncomment below and comment I2C above):
	; -DUSE_PN532_VIA_SPI=1
	; -DPN532_SS_PIN=${DSPI_SS_PIN}
	; -DPN532_SCK_PIN=${DSPI_SCK_PIN}
	; -DPN532_MOSI_PIN=${DSPI_MOSI_PIN}
	; -DPN532_MISO_PIN=${DSPI_MISO_PIN}
	
	; SD Card (SPI)
	-DSDCARD_CS=15
	-DSDCARD_SCK=${DSPI_SCK_PIN}
	-DSDCARD_MISO=${DSPI_MISO_PIN}
	-DSDCARD_MOSI=${DSPI_MOSI_PIN}
	-DHAS_SDCARD=1
	
	; WiFi Features (Built-in ESP32-S3)
	; Beacon Spam, Deauth, Evil Portal, etc. enabled by default
	
	; BLE Features (Built-in ESP32-S3)
	; Bad BLE, BLE Spam, etc. enabled by default
	
	; Battery/Power
	-DBAT_PIN=-1  ; No battery pin on DevKit
	
	; Misc Features
	-DHAS_TOUCH=0  ; No touchscreen on DevKit
	-DHAS_RTC=0    ; No RTC on DevKit
	-DLED=-1       ; No built-in LED indicator
	-DBUZZ_PIN=-1  ; No buzzer
	
	; Memory Optimization
	-DPART_16MB=1
	-DCORE_DEBUG_LEVEL=0
	
	; Firmware Version
	-DGIT_COMMIT_HASH='"DevKit-Build"'
