; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################### CYD MODELS ####################################################
[env:Phantom_S024R]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/phantom>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/phantom

	; ==================== Feature gates ====================
	;-DLITE_VERSION=1  ;limits some features to save space for M5Launcher Compatibility

	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	-DTFT_BL=27
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp), shares the display SPI
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	-DCYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=12
	-DCYD28_TouchR_MOSI=13
	-DCYD28_TouchR_CLK=14
	-DCYD28_TouchR_CS=33

	; ==================== Environment Flags ====================

	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}}'
	-DIR_RX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}, {"Pin 35", 35}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}}'
	-DRF_RX_PINS='{{"Pin 21", 21}, {"Pin 22", 22}, {"Pin 35", 35}}'

	-DROTATION=1

	-DDEVICE_NAME='"Phantom S024R"'

	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=36
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


[env:LAUNCHER_Phantom_S024R]
extends = env:Phantom_S024R
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Phantom_S024R.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

################################# END OF CYD MODELS ####################################################
