; PlatformIO Project Configuration File
; ESP-WROOM-32 + ILI9341 2.4" TFT (no touch) + 5-way tactile switch
;
; TFT Pins:  MISO=19, MOSI=23, SCLK=18, CS=17, DC=16, RST=5, BL=32
; 5-Way Nav: Up=34, Down=26, Left=33, Right=27, Center=35

[env:esp-wroom32-ili9341]
board = esp32
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
upload_flags = --no-stub
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp-wroom32-ili9341>
build_flags =
	${env.build_flags}
	-Iboards/esp-wroom32-ili9341

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================

	; 5-way tactile switch — GPIO 34/35 are input-only (no pull-up on chip);
	; external pull-up resistors are required on these two pins
	-DHAS_5_BUTTONS

	; ==================== Library Flags ====================

	; TFT_eSPI Setup for ILI9341 2.4" display
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=17
	-DTFT_DC=16
	-DTFT_RST=5
	-DTFT_BL=32
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================

	-DDEVICE_NAME='"ESP32-ILI9341"'
	-DBTN_ALIAS='"OK"'

	-DROTATION=1
	; CC1101 GDO0 pin (shares CC1101_bus.io0); the rest of the CC1101/NRF24/PN532/outer
	; SPI bus, GROVE_SDA/SCL, TXLED, BAD_TX/RX and GPS_SERIAL_TX/RX pins are set at
	; runtime in _setup_gpio() (was pins_arduino.h)

lib_deps =
	${env.lib_deps}
lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM
