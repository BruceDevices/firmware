; PlatformIO Project Configuration File
;
; M5Stack StackChan (SKU K151) — CoreS3 head mounted on the StackChan robot body.
; Body (adapter board) wiring, per https://docs.m5stack.com/en/StackChan:
;   - ST25R3916 NFC on the sys I2C bus (G12 SDA / G11 SCL), I2C addr 0x50 (8-bit write),
;     no dedicated IRQ pin (the RFAL fork polls the IRQ registers over I2C when irq < 0)
;   - IR transmitter on G5, IR receiver (IRM56384) on G10
;   - Body I2C devices on the sys bus: ST25R3916 (0x50), INA226 battery monitor (0x41),
;     Si12T top touch panel (0x68), PY32L020 IO expander (0x6F)
;   - Audio: same CoreS3 codecs as the head (AW88298 speaker amp, ES7210 mic codec)
;   - Servos (G6/G7) and the WS2812 ring are NOT driven by this build
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stackchan]
board = esp32s3
monitor_speed = 115200
board_build.partitions = boards/m5stack-stackchan/partitions_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/m5stack-stackchan>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-stackchan

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Let the user pick any GPIO instead of only the curated IR_TX_PINS/RF_TX_PINS list

	-DHAS_RTC  ; Board has an RTC chip (needs RTC_SDA/RTC_SCL)
	-DHAS_RTC_BM8563  ; Board's RTC chip is a BM8563

	-DUSB_as_HID  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)
	-DHAS_TOUCH  ; Board has a touchscreen controller

	-DHAS_SPEAKER  ; 1W speaker behind the AW88298 I2S amp (pins set in interface.cpp)

	; ==================== StackChan robot body ====================
	-DSTACKCHAN=1  ; Body present: NFC/IR wiring defaults + bigger Brucegotchi faces (ui.cpp)

	; ==================== Library Flags ====================

	; TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DILI9341_DRIVER
	-DTFT_INVERSION_ON
	-DUSE_HSPI_PORT
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MOSI=37
	-DTFT_MISO=35
	-DTFT_SCLK=36
	-DTFT_CS=3
	-DTFT_DC=35
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	; The body's IR transmitter/receiver are wired to G5/G10; Grove Port A/B/C
	; (G2/G1, G9/G8, G17/G18) hang on the body as well.
	-DIR_TX_PINS='{{"Body IR LED", 5}, {"Port A", 2}, {"Port B", 9}, {"Port C", 17}}'
	-DIR_RX_PINS='{{"Body IR Recv", 10}, {"Port A", 1}, {"Port B", 8}, {"Port C", 18}}'
	-DRF_TX_PINS='{{"Port A", 2}, {"Port B", 9}, {"Port C", 17}}'
	-DRF_RX_PINS='{{"Port A", 1}, {"Port B", 8}, {"Port C", 18}}'

	-DDEVICE_NAME='"M5Stack StackChan"'
	-DARDUINO_M5STICK_S3=1 ;Used to controle Ext IO Power

	-DADC=10
	-DRTC_SDA=12
	-DRTC_SCL=11

	; Font sizes
	-DROTATION=1
	-DM5STACK

	-DBTN_ALIAS='"Ok"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.11
