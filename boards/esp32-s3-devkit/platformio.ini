; ESP32-S3 DevKit Board Configuration with SH1106 OLED and 6 Navigation Buttons

[env:esp32-s3-devkit]
board = esp32-s3-devkit-1
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-devkit>
build_flags =
	${env.build_flags}
	-Iboards/esp32-s3-devkit
	-D DEVICE_NAME='"ESP32-S3 DevKit OLED"'
	
	; Display Configuration
	-D HAS_SCREEN=1
	-D OLED_DISPLAY=1
	-D OLED_WIDTH=128
	-D OLED_HEIGHT=64
	-D ROTATION=0
	
	; I2C Display pins
	-D SYS_I2C_SDA=8
	-D SYS_I2C_SCL=9
	-D OLED_I2C_ADDR=0x3C
	
	; Navigation Buttons
	-D HAS_BTN=1
	-D UP_BTN=0
	-D DOWN_BTN=1
	-D LEFT_BTN=2
	-D RIGHT_BTN=4
	-D SEL_BTN=5
	-D BACK_BTN=6
	-D BTN_ACT=LOW
	-D DEBOUNCE_DELAY=50
	
	; No touch screen
	-D HAS_TOUCH=0
	
	; No RGB LED
	-D HAS_RGB_LED=0
	-D RGB_LED=-1
	
	; No battery monitoring (can be added later)
	-D BAT_PIN=-1
	
	; UART Configuration
	-D SERIAL_TX=43
	-D SERIAL_RX=44
	
	; Disable IR/RF features if space is limited
	-D USE_CC1101_VIA_SPI=0
	-D USE_NRF24_VIA_SPI=0
	-D HAS_NS4168_SPKR=0

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SH110X@^2.1.10
	adafruit/Adafruit GFX Library@^1.11.9

