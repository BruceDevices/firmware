[env:isno-rf-868]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_qspi

; Compile l'interface.cpp de ce dossier (sans quoi les defauts faibles de
; src/main.cpp gagnent et la carte demarre sans aucun brochage).
build_src_filter = ${env.build_src_filter} +<../boards/isno-rf-868>

build_flags =
	${env.build_flags}
	-Iboards/isno-rf-868
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1  ; S3 : Serial sur l'USB natif
	-D USE_DUMMY_TFT=1           ; carte sans ecran : tout dessin est un no-op
	-DDEVICE_NAME='"ISNO RF868"'

; USE_DUMMY_TFT ne demande aucune lib d'affichage ; FastLED/RadioLib et le
; reste sont deja dans le platformio.ini racine.
lib_deps =
	${env.lib_deps}
