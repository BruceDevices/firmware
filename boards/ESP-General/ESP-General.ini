; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32-s3-devkitc-1-psram]
board_build.arduino.memory_type = qio_opi  ; NEEDED FOR 8MB PSRAM (N16R8)
;board_build.partitions = custom_16Mb.csv
;board_upload.flash_size = 16MB
;monitor_speed = 115200
;board_build.partitions = custom_16Mb.csv
;board_build.f_flash = 40000000L
;board_upload.flash_size = 16MB
;board_upload.maximum_size = 16777216
;board_build.f_flash = 40000000L
;board_build.flash_mode = qio
extends                 = env:esp32-s3-devkitc-1
build_flags =
	${env:esp32-s3-devkitc-1.build_flags}

	; ==================== Framework Control Flags ====================
	-D BOARD_HAS_PSRAM=1  ; Board has PSRAM populated


[env:esp32-s3-devkitc-1]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; VERIFY: old JSON is "N8, 8 MB QD, No PSRAM" (no memory_type set at all); generic
; esp32s3 defaults to qio_opi (octal PSRAM). Overriding to qio_qspi here so this
; PSRAM-less base env doesn't try to init a PSRAM chip that isn't populated.
board_build.arduino.memory_type = qio_qspi
build_src_filter =${env.build_src_filter} +<../boards/ESP-General>
build_flags =
	${env.build_flags}
	-Iboards/ESP-General

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)

	; ==================== Feature gates ====================
	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; ==================== Library Flags ====================
	# No panel: DisplayDrivers' no-op backend, so the display code still
	# compiles and every draw call costs nothing.
	-DUSE_DUMMY_TFT=1


	; ==================== Environment Flags ====================
	-DESP32S3DEVKITC1 ; Used in src/core/serial_commands/gpio_commands.cpp
	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h

	; sd card pins
	; suggested https://github.com/espressif/esp-idf/tree/master/examples/storage/sd_card/sdmmc

	; tft vars
	-DROTATION=1

	; ui control buttons
	-DBTN_ALIAS='"OK"'
	-DDEVICE_NAME='"ESP32-S3 DevkitC"'

lib_deps =
	${env.lib_deps}
