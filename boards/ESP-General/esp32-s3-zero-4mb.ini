; Drop-in PlatformIO environment for Waveshare / generic ESP32-S3-Zero (ESP32-S3FH4R2)
; Flash: 4MB Quad SPI | PSRAM: 2MB Quad SPI | Display: 1.3" 128x64 I2C OLED (SH1106)
;
; Place this file at: boards/ESP-General/esp32-s3-zero-4mb.ini
; PlatformIO loads it automatically via `extra_configs = boards/*/*.ini` in platformio.ini.

[env:esp32-s3-zero-4mb]
extends = env:esp32-s3-devkitc-1
board_build.partitions = custom_4Mb_full.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.psram_type = qio
board_build.arduino.memory_type = dio_qspi
lib_ignore =
  ST25R3916-fork
  NFC-RFAL-fork
  TFT_eSPI
  ESP8266Audio
  ESP8266SAM
build_unflags =
  -DUSE_DUMMY_TFT=1
  -DROTATION=1
  -DDEVICE_NAME='"ESP32-S3 DevkitC"'
  -DDEFAULT_COLOR_INVERTED=1
  -DFM=2
  -DFG=3
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  ${env_4mb.build_flags}
  -DBOARD_HAS_PSRAM=1
  -DLITE_VERSION=1
  -DDEVICE_NAME='"ESP32-S3-Zero"'
  -DHAS_RGB_LED=1
  -DRGB_LED=21
  -DLED_TYPE=WS2812B
  -DLED_ORDER=GRB
  -DLED_COUNT=1
  -DLED_COLOR_STEP=15
  -DUSE_SH1106=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=64
  -DROTATION=0
  -DFP=1
  -DFM=1
  -DFG=1
  -DDEFAULT_COLOR_INVERTED=0
  -DGROVE_SDA=7
  -DGROVE_SCL=8
  -DTFT_SDA=7
  -DTFT_SCL=8
