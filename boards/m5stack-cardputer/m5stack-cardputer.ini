; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cardputer]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; VERIFY: old JSON had no explicit memory_type (M5Stack Cardputer has no on-board
; PSRAM); generic esp32s3 default is qio_opi. Overriding to qio_qspi so this
; PSRAM-less board doesn't try to init a PSRAM chip that isn't populated.
board_build.arduino.memory_type = qio_qspi
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cardputer

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)

	; ==================== Feature gates ====================

	;Microphone
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	;RGB LED runned by xylopyrographer/LiteLED@^1.2.0 library
	-DHAS_RGB_LED=1

	;Speaker to run music, compatible with NS4168
	-DHAS_SPEAKER=1  ; Board has an I2S speaker (wiring set in interface.cpp _setup_gpio)

	;Can run USB as HID
	-DUSB_as_HID=1
	-DHAS_KEYBOARD
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	-DARDUINO_M5STACK_CARDPUTER

	-D ANALOG_BAT_PIN=10
	-D ES8311_CODEC=1
	-D ES8311_ADDR=0x18
	-DRGB_LED=21

	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{ {"Default", 44}, {"M5 IR Mod", 2}, {"Grove W", 1}, {"Grove Y", 2}, {"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15} }'
	-DIR_RX_PINS='{ {"M5 IR Mod", 1}, {"Grove W", 1}, {"Grove Y", 2},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 2}, {"Grove W", 1}, {"Grove Y", 2},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 1}, {"Grove W", 1}, {"Grove Y", 2},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'


	; M5Stack Cap CC1101 (CC1101 + ST25R3916 NFC on the Cardputer-Adv Cap-Bus).
	; Both chips share the default SPI port (SCLK=G40, MOSI=G14, MISO=G39).
	; https://docs.m5stack.com/en/cap/Cap_CC1101
	-DCAP_CC1101_POWER_EN=3
	-DCAP_CC1101_SS_PIN=5
	-DCAP_CC1101_SW0_PIN=13
	-DCAP_NFC_SS_PIN=6
	-DCAP_NFC_IRQ_PIN=4
	-DCAP_NFC_SCK_PIN=40
	-DCAP_NFC_MISO_PIN=39
	-DCAP_NFC_MOSI_PIN=14
	-DROTATION=1

	;Default SPI port

	-DDEVICE_NAME='"M5Stack Cardputer"'
	-DKB_HID_EXIT_MSG='"fn + Ok to exit"'
	-DSHIFT=0x80
	-DKEY_LEFT_CTRL=0x80
	-DKEY_LEFT_SHIFT=0x81
	-DKEY_LEFT_ALT=0x82
	-DKEY_FN=0xff
	-DKEY_OPT=0x83
	-DKEY_BACKSPACE=0x2a
	-DKEY_TAB=0x2b
	-DKEY_ENTER=0x28
	; NOTE: the Cardputer ASCII keymap (_kb_asciimap[128]) used to live in
	; pins_arduino.h and reach Keyboard.cpp only via force-included headers.
	; It has been moved to lib/utility/Keyboard.h (included directly by
	; Keyboard.cpp) so it no longer depends on pins_arduino.h at all.
	-DLED_TYPE=SK6812
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_COLOR_STEP=15
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.2
