; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-sticks3]
board = esp32s3
board_build.psram = enabled
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-sticks3>
build_flags =
	${env.build_flags}

	-Iboards/m5stack-sticks3

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DCONFIG_SPIRAM=y
	-DCONFIG_SPIRAM_MODE_OCT=1
	-DCONFIG_SPIRAM_USE_MALLOC=1
	-DCONFIG_SPIRAM_BOOT_INIT=1
	-DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1

	; ==================== Feature gates ====================

	-DHAS_2_BUTTONS  ; Board navigates with exactly 2 physical buttons
	-DBUTTONS_IDF_COMPONENT=1 ; hal_buttons_poll_2 (src/hal/inputs/buttons.cpp) via lib/ESP32_Button

	;Features Enabled
	;-DLITE_VERSION=1  ;limits some features to save space for M5Launcher Compatibility
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	-DHAS_SPEAKER=1  ; Board has an I2S speaker (wiring set in interface.cpp _setup_gpio)

	;Can run USB as HID
	-DUSB_as_HID=1  ;uncomment to enable

	; ==================== Library Flags ====================

	; Using M5GFX driver
	-DUSE_M5GFX=1

	;TFT_eSPI Setup
	;-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_CS=41
	-DTFT_DC=45
	-DTFT_RST=21
	-DTFT_MOSI=39
	-DTFT_SCLK=40
	-DTFT_MISO=-1
	-DTFT_BL=38
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=39
	-DDEEPSLEEP_PIN_ACT=LOW

	; ES8311 Codec (ADV)
	-D ES8311_CODEC=1
	-D ES8311_ADDR=0x18

	;Buttons configuration
	-DBTN_ALIAS='"M5"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{ {"Default", 46}, {"M5 IR Mod", 9}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'
	-DIR_RX_PINS='{ {"Default", 42}, {"M5 IR Mod", 10}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 9}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 10}, {"G8",8}, {"G1",1}, {"G0",0}, {"Grove W", 10}, {"Grove Y", 9},{"G5",5},{"G4",4},{"G6",6},{"G7",7},{"G43",43},{"G44",44},{"G2",2},{"G3",3}}'

	-DROTATION=3

	-DDEVICE_NAME='"M5StickS3"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified

lib_ignore =
	TFT_eSPI
