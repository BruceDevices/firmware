; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Mako]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/Mako>
build_flags =
	${env.build_flags}
	-Iboards/Mako

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	-DHAS_5_BUTTONS  ; Board navigates with 5 physical buttons (D-pad style)

	; ==================== Library Flags ====================
	-D CONFIG_ASYNC_TCP_STACK_SIZE=1024*10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=32

	; PMIC
	-DPMIC_BQ25896

	; TFT_eSPI
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_INVERSION_ON
	-DTFT_RGB_ORDER=TFT_BGR
	; Common TFT definitions
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=24
	-DTFT_RST=-1
	-DTFT_DC=23
	-DTFT_MISO=2
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=3
	; #define TOUCH_CS 1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	; InfraRed

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"Mako"'

	-D SAFE_STACK_BUFFER_SIZE=1024
	-D SERIAL_CMDS_TASK_STACK_SIZE=1024*12
	;-D INTERPRETER_TASK_STACK_SIZE=1024*8
	-D SSH_TASK_STACK_SIZE=1024*8
	-D INPUT_HANDLER_TASK_STACK_SIZE=2048

	; ui control buttons
	-DBTN_ALIAS='"OK"'

	; --- migrated from pins_arduino.h ---
	-DRGB_LED=27
	-DLED_TYPE=WS2812B
	-DLED_ORDER=RGB
	-DLED_COUNT=10
	-DLED_COLOR_STEP=5

	-DIO_EXPANDER_AW9523
	-DIO_EXP_NRF=12
	-DIO_EXP_UART=13
	-DIO_EXP_NFC=7
	; IO BUTTONS
	-DIO_EXP_UP=0
	-DIO_EXP_DOWN=9
	-DIO_EXP_ESC=8
	-DIO_EXP_LEFT=10
	-DIO_EXP_RIGHT=11
	-DIO_EXP_SEL=1
	; #define USE_BOOST

lib_deps =
	${env.lib_deps}
