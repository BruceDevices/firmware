; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:smoochiee-board]
board = esp32s3
build_src_filter =${env.build_src_filter} +<../boards/smoochiee-board>
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_flags =
	${env.build_flags}
	-Iboards/smoochiee-board

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)
	-DHAS_5_BUTTONS  ; Board navigates with 5 physical buttons (D-pad style)

	; RGB LED
	-DHAS_RGB_LED=1

	; ==================== Library Flags ====================
	-D USE_HSPI_PORT=1

	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=6
	-DTFT_RST=16
	-DTFT_DC=15
	-DTFT_MISO=8
	-DTFT_MOSI=17
	-DTFT_SCLK=18
	-DTFT_CS=7
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	-DIR_TX_PINS='{{"M5 IR Mod", 47}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 48}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
	-DRF_TX_PINS='{{"M5 RF433T", 47}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"M5 RF433R", 48}, {"Grove W", 48}, {"Grove Y", 47}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)
	-DDEVICE_NAME='"Smoochiee Board"'

	; Modified elsewhere
	-DPMIC_BQ25896

	-DBTN_ALIAS='"OK"'

	-DROTATION=1
	-DRGB_LED=45
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=16
	-DLED_COLOR_STEP=15

	; USE BOOST ENABLE PMIC 5V OUTPUT
	-DUSE_BOOST

	; Mic

	; IO EXPANDER
	-DIO_EXPANDER_AW9523
	-DIO_EXP_GPS=13
	-DIO_EXP_MIC=4
	-DIO_EXP_VIBRO=2
	-DIO_EXP_CC_RX=7
	-DIO_EXP_CC_TX=12

lib_deps =
	${env.lib_deps}
