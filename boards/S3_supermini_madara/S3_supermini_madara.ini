; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:S3_supermini_madara]
board = esp32s3
build_src_filter =${env.build_src_filter} +<../boards/S3_supermini_madara>
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_4Mb_full.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
	${env.build_flags}
	-Iboards/S3_supermini_madara

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)
	# Restrict IR protocols to save Flash on 4mb devices

	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	; ---- migrated from pins_arduino.h ----
	; Modified elsewhere
	-DUSB_as_HID=1
	-DHAS_3_BUTTONS  ; Board navigates with exactly 3 physical buttons
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)

	; ==================== Library Flags ====================
	-D USE_HSPI_PORT=1
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=0
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=280
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=43
	-DTFT_RST=12
	-DTFT_DC=13
	-DTFT_MISO=8
	-DTFT_MOSI=11
	-DTFT_SCLK=10
	-DTFT_CS=44
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	; RGB LED

	; IRremoteESP8266 flags
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

	; ==================== Environment Flags ====================
	-DRF_TX_PINS='{{"Pin 4", 4}, {"Pin 5", 5}}'
	-DRF_RX_PINS='{{"Pin 4", 4}, {"Pin 5", 5}}'
	-DIR_TX_PINS='{{"Pin 4", 4}, {"Pin 5", 5}}'
	-DIR_RX_PINS='{{"Pin 4", 4}, {"Pin 5", 5}}'
	-DDEVICE_NAME='"Madara Board"'

	-DBTN_ALIAS='"OK"'
	-DDEEPSLEEP_WAKEUP_PIN=1
	-DROTATION=1
	-DRGB_LED=48
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=16
	-DLED_COLOR_STEP=15

lib_deps =
	    ${env.lib_deps}
