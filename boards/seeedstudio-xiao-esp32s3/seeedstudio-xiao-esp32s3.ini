; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

######################## Seeed Studio XIAO ESP32S3 (bare module) ##############################
; The XIAO ESP32S3 / XIAO ESP32S3 Sense module on its own: ESP32-S3R8, 8MB
; flash, 8MB octal PSRAM, native USB-C. No display and no buttons on the
; module, so this is a headless build (DisplayDrivers' no-op backend) driven
; over the WebUI / serial commands -- same shape as the esp32-s3-devkitc-1 env
; in boards/ESP-General.
;
; interface.cpp seeds bruceConfigPins with the XIAO footprint's own labelled
; functions (I2C on D4/D5, UART on D6/D7, SPI on D8/D9/D10); everything is
; remappable at runtime from Config > Set Device pins. See connections.md.
;
; https://www.seeedstudio.com/XIAO-ESP32S3-p-5627.html
[env:seeedstudio-xiao-esp32s3]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_opi  ; ESP32-S3R8: 8MB octal PSRAM
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 921600

build_src_filter =${env.build_src_filter} +<../boards/seeedstudio-xiao-esp32s3>
build_flags =
	${env.build_flags}
	-Iboards/seeedstudio-xiao-esp32s3

	; ==================== Framework Control Flags ====================
	-D BOARD_HAS_PSRAM=1
	-D ARDUINO_USB_MODE=1         ; native USB-OTG/CDC
	-D ARDUINO_USB_CDC_ON_BOOT=1  ; console on USB-C, leaving D6/D7 free as UART

	; ==================== Feature gates ====================
	-D USB_as_HID=1               ; native USB: BadUSB/ducky typer, U2F, clicker
	-D ALLOW_ALL_GPIO_FOR_IR_RF=1 ; no fixed IR/RF wiring on a bare module

	; ==================== Library Flags ====================
	# No panel: DisplayDrivers' no-op backend, so the display code still
	# compiles and every draw call costs nothing.
	-D USE_DUMMY_TFT=1

	; ==================== Environment Flags ====================
	-D DEVICE_NAME='"Seeed XIAO ESP32S3"'
	-D BTN_ALIAS='"OK"'
	-D ROTATION=1

lib_deps =
	${env.lib_deps}
