#################################### Hosyond 3.5" ESP32-S3 #######################################
; Hosyond integrated 3.5" QSPI display board
; Hardware: ESP32-S3-N16R8 (16MB Flash, 8MB OPI PSRAM)
;           ST77922 320x480 QSPI display (Bus_SPI quad, SPI2_HOST; see lgfx_st77922.h)
;           ST77922 integrated capacitive touch (I2C @ 0x55)
;           WS2812 NeoPixel (GRBW) on GPIO40
;           ES8311 I2S audio codec (MCK=17, BCK=18, DOUT=15, WS=21)
;           SD/MMC 4-bit (CLK=5, CMD=4, D0=6, D1=7, D2=2, D3=3)
;           Battery ADC: GPIO8 (ADC1_CH7, 2× divider)

[env:hosyond-35-s3]
board = hosyond-35-s3
; Use a dedicated variant dir so interface.cpp is not compiled as FrameworkArduinoVariant
board_build.variants_dir = boards/_variants
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/hosyond-35-s3>
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0

build_flags =
    ${env.build_flags}
    -Iboards/hosyond-35-s3
    -Os
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; ----- Display: ST77922 QSPI via LovyanGFX -----
    -DUSE_LOVYANGFX=1
    -DLOVYAN_PANEL=Panel_ST77922
    -DLOVYAN_BUS=Bus_SPI
    -DLOVYAN_QSPI_BUS=1
    -DLOVYAN_CUSTOM_PANEL_HEADER='"lgfx_st77922.h"'

    ; LovyanGFX QSPI bus pins (SPI2_HOST)
    -DTFT_SPI_HOST=SPI2_HOST
    -DTFT_WRITE_FREQ=40000000
    -DTFT_READ_FREQ=16000000
    -DTFT_SPI_MODE=0
    -DTFT_USE_LOCK=true
    -DTFT_CS=10
    -DTFT_SCLK=12
    -DTFT_QSPI_D0=11
    -DTFT_QSPI_D1=13
    -DTFT_QSPI_D2=14
    -DTFT_QSPI_D3=9
    -DTFT_RST=-1
    -DTFT_BUSY_PIN=-1

    ; LovyanGFX panel config
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MEM_WIDTH=320
    -DTFT_MEM_HEIGHT=480
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=0
    -DTFT_RGB_ORDER=1

    ; Backlight PWM on GPIO41
    -DBACKLIGHT=41
    -DTFT_BL=41
    -DMINBRIGHT=10
    -DTFT_BRIGHT_FREQ=5000
    -DTFT_BRIGHT_Bits=8

    ; ----- Touch: ST77922 integrated I2C @ 0x55 -----
    -DHAS_TOUCH=1
    -DHAS_CAPACITIVE_TOUCH=1
    -DTOUCH_ST77922_I2C=1
    -DST77922_TOUCH_ADDR=0x55
    -DTOUCH_SDA=38
    -DTOUCH_SCL=39
    -DTOUCH_RST=48
    -DTOUCH_INT=47

    ; ----- SD/MMC 4-bit -----
    -DUSE_SD_MMC=1
    -DBOARD_HAS_SDMMC=1
    -DSDMMC_CLK=5
    -DSDMMC_CMD=4
    -DSDMMC_D0=6
    -DSDMMC_D1=7
    -DSDMMC_D2=2
    -DSDMMC_D3=3

    ; ----- RGB LED -----
    -DHAS_RGB_LED=1
    -DRGB_LED=40

    ; ----- Audio: ES8311 codec (I2C 0x18) + SC8002B/FM8002E amp, I2S -----
    -DHAS_NS4168_SPKR=1
    -DES8311_CODEC=1
    -DES8311_ADDR=0x18
    -DBCLK=18
    -DWCLK=21
    -DDOUT=15
    -DMCLK=17
    -DI2S_MCLK_PIN=17
    -DAMP_EN_PIN=1

    ; ----- Battery ADC -----
    -DADC_BAT_PIN=8
    -DANALOG_BAT_PIN=8

    ; ----- Buttons -----
    -DHAS_BTN=1
    -DBTN_PIN=0
    -DBTN_ACT=LOW
    -DBTN_ALIAS='"Ok"'

    ; ----- Other I/O -----
    -DIR_TX_PINS='{{"IO45", 45}}'
    -DIR_RX_PINS='{{"IO46", 46}}'
    -DRF_TX_PINS='{{"IO45", 45}, {"IO46", 46}}'
    -DRF_RX_PINS='{{"IO46", 46}, {"IO45", 45}}'
    -DTXLED=45
    -DRXLED=46
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; Serial/GPS
    -DSERIAL_TX=43
    -DSERIAL_RX=44
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    -DDEVICE_NAME='"Hosyond 3.5 S3"'
    -DHAS_SCREEN=1
    -DROTATION=1

lib_deps =
    ${env.lib_deps}
    https://github.com/lovyan03/LovyanGFX#develop

lib_ignore =
    TFT_eSPI

################################## END Hosyond 3.5" S3 ############################################
