; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_16Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 4521984
;board_upload.maximum_ram_size=532480
build_src_filter =${env.build_src_filter} +<../boards/m5stack-core2>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-core2

	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	;Microphone
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	;Have RTC Chip
	-DHAS_RTC=1

	;Touchscreen Config
	-DHAS_TOUCH=1

	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=38
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=15
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000

	; ==================== Environment Flags ====================
	-DRTC_SDA=21
	-DRTC_SCL=22


	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"M5 IR Mod", 32}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 33}, {"Grove W", 33}, {"Grove Y", 32}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"M5 RF433T", 32}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DRF_RX_PINS='{{"M5 RF433R", 33}, {"Grove W", 33}, {"Grove Y", 32}}'

	-DROTATION=1
	-DM5STACK=1

	-DDEVICE_NAME='"M5Stack Core 2"'

	; pins_arduino.h pins
	-DTX2=14
	-DRX2=13
lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.11
