; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; LilyGO T-Watch Ultra: ESP32-S3 (16 MB QSPI flash, 8 MB QSPI PSRAM),
; 2.06" CO5300 QSPI AMOLED 410x502 (CST9217 touch), AXP2101 PMU,
; XL9555 IO expander, ST25R3916 NFC, MIA-M10Q GNSS, SX1262 LoRa
; (board revision per unit), PCF85063A RTC, DRV2605 haptic,
; MAX98357A speaker amp, T3902 PDM mic.
; Pins follow the official LilyGO documentation
; (https://wiki.lilygo.cc/products/t-watch-series/t-watch-ultra/).

[env:lilygo-t-watch-ultra]
board = esp32s3
; The generic esp32s3 JSON defaults to OPI PSRAM; this board's PSRAM is quad.
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter = ${env.build_src_filter} +<../boards/lilygo-t-watch-ultra>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-watch-ultra

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1          ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT=1   ; Route Serial over native USB-CDC (UART0 pins 43/44 go to the GNSS)
	-DARDUINO_USB_MODE=1          ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM             ; 8 MB QSPI PSRAM (must match memory_type above)

	; ==================== Feature gates ====================
	-DHAS_TOUCH=1                 ; CST9217 capacitive touch (I2C 0x1A)
	-DTOUCH_CTRL_CST8XX=1         ; hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_1_BUTTON=1              ; BOOT button on GPIO0 (single=Next, double=Prev, long=Sel, extra-long=Esc)
	-DHAS_SPEAKER=1               ; MAX98357A I2S amp (wiring set in interface.cpp _setup_gpio)
	-DHAS_MICROPHONE=1            ; T3902 PDM mic (wiring set in interface.cpp _setup_gpio)
	-DHAS_RTC=1                   ; PCF85063A on the system I2C bus
	-DHAS_RTC_PCF85063A=1
	-DUSB_as_HID=1                ; BadUSB/ducky typer over native USB

	; ==================== Library Flags (display) ====================
	; CO5300 AMOLED on the ESP32 QSPI peripheral. TFT_eSPI cannot drive it;
	; Arduino_GFX is the default backend, so no USE_* flag.
	-D TFT_DATABUS_N=1            ; Arduino_ESP32QSPI
	-D TFT_DISPLAY_DRIVER_N=41    ; Arduino_CO5300
	-D USE_CANVAS=1               ; full-screen RGB565 framebuffer in PSRAM
	; The CO5300 expects the rotated window, so the driver owns the rotation
	; and the canvas is allocated already rotated.
	-D TFT_CANVAS_ROTATE_OUTPUT=1
	-D TFT_WIDTH=502
	-D TFT_HEIGHT=410
	-D TFT_CS=41
	-D TFT_RST=37
	-D TFT_SCLK=40
	-D TFT_D0=38
	-D TFT_D1=39
	-D TFT_D2=42
	-D TFT_D3=45
	-D TFT_IPS=1
	; Panel window offsets (502x410 window centered in the 512x512 driver memory)
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=22
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=22

	; ==================== Environment Flags ====================
	-D DEVICE_NAME='"Lilygo T-Watch Ultra"'
	-DBTN_ALIAS='"BOOT"'          ; Label shown in the UI for the main select button
	; Screen orientation: the canvas is allocated rotated, UI runs portrait 410x502
	-DROTATION=3
	; UI font sizes for the 410x502 panel
	-D FP=2
	-D FM=3
	-D FG=6

	; No IR LED and no one-pin RF header on this board
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	; Onboard radio is an SX1262 (LoRa BUSY pin is only used by the SX1262)
	-DLORA_BUSY=48
	-DDEFAULT_LORA_RADIO='"SX1262"'

	; RTC pins when it is not on the default Wire pins
	-DRTC_SDA=3
	-DRTC_SCL=2

	; Deep sleep / power off wake-up: BOOT button (GPIO0), pressed = LOW
	-DDEEPSLEEP_WAKEUP_PIN=0
	-DDEEPSLEEP_PIN_ACT=LOW

	; No backlight pin: brightness is a CO5300 register set in interface.cpp
	; _setBrightness(); TFT_BL stays at its -1 default.

; Only the display library needs a lib_deps entry here -- everything else this
; board uses (SensorLib touch/haptic/XL9555, XPowersLib AXP2101, RTC) is
; vendored in lib/, and RadioLib/ST25R3916 are already in the root
; platformio.ini. The CO5300 QSPI driver needs Arduino_GFX >= 1.5.5.
lib_deps =
	${env.lib_deps}
	moononournation/GFX Library for Arduino @ ^1.5.5
