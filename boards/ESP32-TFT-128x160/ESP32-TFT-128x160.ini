[env:esp32-tft-128x160]
extends = env_4mb

board = ESP32-TFT-128x160
board_build.partitions = custom_4Mb_bruce.csv

build_src_filter =
    ${env.build_src_filter}
    +<../boards/ESP32-TFT-128x160>

build_flags =
    ${env_4mb.build_flags}

    ; Board configuration
    -Iboards/ESP32-TFT-128x160

    ; Restore Bruce core definitions
    -DBRUCE_VERSION='"dev"'
    -DEEPROMSIZE=128
    -DLH=8
    -DLW=6

    ; Board identification
    -DESP32_TFT_128X160
    -DDEVICE_NAME='"ESP32 Generic TFT 128x160"'
    -DGIT_COMMIT_HASH='"Homebrew"'

    ; Display
    -DHAS_SCREEN=1
    -DROTATION=0
    -DBACKLIGHT=-1
    -DMINBRIGHT=160

    ; ------------------------------------------------
    ; ST7735 1.8" 128x160 V1.1
    ; ------------------------------------------------
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB=1

    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160

    ; TFT SPI pins
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=-1

    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17

    ; No separate backlight control
    -DTFT_BL=-1

    ; Display commands
    ;-DTFT_DISPON=0x29
    ;-DTFT_DISPOFF=0x28

    ; Fonts
    -DSMOOTH_FONT=1

    ; ------------------------------------------------
    ; SPI
    ; ------------------------------------------------
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5

    -DSPI_FREQUENCY=20000000

    ; ------------------------------------------------
    ; SD CARD
    ; ------------------------------------------------
    -DSDCARD_CS=4
    -DSDCARD_SCK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=23

    ; ------------------------------------------------
    ; I2C
    ; ------------------------------------------------
    -DGROVE_SDA=33
    -DGROVE_SCL=26

    ; UART / GPS

    -DGPS_SERIAL_RX=22
    -DGPS_SERIAL_TX=21

   ; navigation
    -DSEL_BTN=25
    -DUP_BTN=33
    -DDW_BTN=27
    -DESC_BTN=26
    -DBTN_ALIAS='"OK"'


    ; Font sizes used by Bruce
    -DFP=1
    -DFM=1
    -DFG=2


    ; BadUSB serial pins
    ;
    ; Change these if your CH9329/BadUSB hardware
    ; is connected to different GPIOs.

    -DBAD_RX=22
    -DBAD_TX=21

lib_deps =
    ${env_4mb.lib_deps}
