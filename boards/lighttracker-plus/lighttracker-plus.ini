; QRP Labs LightTracker Plus v1.0 — Bruce environment
; ESP32-S3 (8MB, no PSRAM) + SX1268 (E22-400M30S 433 MHz) + L80 GPS
; Display: 0.96" SSD1306 128x64 I2C OLED on the OLED header (SDA=3, SCL=4, addr 0x3C)
; Input:   single BOOT button (GPIO0) — short = Next, medium = Select, long = Back
;
; Pin sources: lightaprs/LightTracker-Plus-1.0 (All_Modules_Test) and
;              richonguzman/LoRa_APRS_Tracker variants/QRPLabs_LightTracker_Plus_1_0
;
; Build:  pio run -e lighttracker-plus
; Flash:  pio run -e lighttracker-plus -t upload

[env:lighttracker-plus]
board = lighttracker-plus
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/lighttracker-plus>
build_flags =
	${env.build_flags}
	-Iboards/lighttracker-plus
	-DCORE_DEBUG_LEVEL=0
	-DUSB_as_HID=1

	; ---- OLED SSD1306 128x64 via LovyanGFX (I2C) ----
	-DHAS_SCREEN=1
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_SSD1306
	-DLOVYAN_BUS=Bus_I2C
	-DLOVYAN_I2C_BUS=1
	-DTFT_I2C_PORT=0
	-DTFT_I2C_WRITE=400000
	-DTFT_I2C_READ=400000
	-DTFT_SDA=3
	-DTFT_SCL=4
	-DTFT_ADDR=0x3C
	-DTFT_CS=-1
	-DTFT_RST=-1
	-DTFT_DC=-1
	-DTFT_BUSY_PIN=-1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=64
	-DTFT_MEM_WIDTH=128
	-DTFT_MEM_HEIGHT=64
	-DTFT_OFFSET_X=0
	-DTFT_OFFSET_Y=0
	-DTFT_INVERTION=0
	-DTFT_RGB_ORDER=0
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	-DTOUCH_CS=-1
	-DBACKLIGHT=-1
	-DMINBRIGHT=0
	-DROTATION=0          ; landscape 128x64 (use 2 if the image is upside down)
	-DFP=1
	-DFM=1
	-DFG=2
	-DBTN_ALIAS='"BOOT"'
	-DFM_RSTPIN=-1

	; ---- I2C for Bruce modules ----
	; The only I2C bus (GPIO3/4) is owned by the OLED driver, so Bruce's own
	; I2C features are left unassigned to avoid fighting over the pins.
	-DGROVE_SDA=-1
	-DGROVE_SCL=-1
	-DSYS_I2C_SDA=-1
	-DSYS_I2C_SCL=-1

	; ---- IR / single-pin RF modules (external, free header GPIOs) ----
	-DIR_TX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'
	-DIR_RX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'
	-DTXLED=7
	-DRXLED=8
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'
	-DRF_RX_PINS='{{"GPIO7", 7}, {"GPIO8", 8}, {"GPIO15", 15}}'

	; ---- No SD card ----
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; ---- Shared SPI bus (LoRa) ----
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10

	; ---- LoRa SX1268 (E22-400M30S) ----
	-DLORA_SCK=12
	-DLORA_MISO=13
	-DLORA_MOSI=11
	-DLORA_CS=10
	-DLORA_RST=9
	-DLORA_DIO0=5
	-DLORA_IRQ=5
	-DLORA_BUSY=6
	-DLORA_RXEN=42
	-DLORA_TXEN=14
	-DLORA_POWER_CTRL=21
	-DLORA_DEFAULT_SX126X=1
	-DLORA_TCXO_VOLTAGE=1.8

	; ---- GPS Quectel L80 (ESP RX=18 <- GPS TX, ESP TX=17 -> GPS RX) ----
	-DGPS_SERIAL_RX=18
	-DGPS_SERIAL_TX=17
	-DGPS_VCC_PIN=33      ; PNP switch: LOW = GPS on

	-DDEVICE_NAME='"LightTracker Plus"'

lib_deps =
	${env.lib_deps}
	https://github.com/lovyan03/LovyanGFX#develop

lib_ignore =
	TFT_eSPI
