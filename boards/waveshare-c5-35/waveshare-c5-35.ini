; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Waveshare ESP32-C5-Touch-LCD-3.5 (ESP32-C5-WROOM-1U, 8MB PSRAM)
; ST7796 320x480 SPI display sharing its bus with the microSD, FT6336 capacitive touch,
; ES8311 codec + NS4150B amp + onboard speaker/mic, AXP2101 PMU. The I/O expander @0x24
; (a CH32V006 MCU) owns LCD reset, touch reset and the backlight.
[env:waveshare-c5-35]
board = esp32c5
board_build.partitions = custom_8Mb.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.arduino.memory_type = qio_qspi
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-c5-35>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-c5-35
	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1          ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT=1   ; Serial on the native USB-Serial/JTAG port
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1
	; ==================== Feature gates ====================
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_FT6X36=1         ; FT6336, hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_CAPACITIVE_TOUCH=1
	-DHAS_SPEAKER=1               ; I2S -> ES8311 -> NS4150B amp, wiring set in interface.cpp _setup_gpio
	-DHAS_MICROPHONE=1            ; onboard mic -> ES8311 ADC, wiring set in interface.cpp _setup_gpio
	; ==================== Library Flags (display) ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7796_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MISO=2                  ; shared with the microSD
	-DTFT_MOSI=7
	-DTFT_SCLK=6
	-DTFT_CS=8
	-DTFT_DC=5
	-DTFT_RST=-1                  ; LCD reset is EXIO1 on the I/O expander
	-DTFT_BL=-1                   ; backlight is the I/O expander PWM, see _setBrightness()
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"Waveshare C5 3.5"'
	-DROTATION=3
	-DBTN_ALIAS='"Boot"'
	; IR / one-pin RF: only the free ESP32 GPIOs on the 2x16 header J3 (GPIO1 = pin 17,
	; GPIO0 = pin 15). GPIO28 (pin 21) is the BOOT button, every other GPIO is onboard.
	-DIR_TX_PINS='{{"GPIO1 (J3-17)", 1}, {"GPIO0 (J3-15)", 0}}'
	-DIR_RX_PINS='{{"GPIO0 (J3-15)", 0}, {"GPIO1 (J3-17)", 1}}'
	-DRF_TX_PINS='{{"GPIO1 (J3-17)", 1}, {"GPIO0 (J3-15)", 0}}'
	-DRF_RX_PINS='{{"GPIO0 (J3-15)", 0}, {"GPIO1 (J3-17)", 1}}'
lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3 ; AXP2101 battery gauge
