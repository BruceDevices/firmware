; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cplus2]
board = esp32
board_build.partitions = custom_8Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cplus2>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cplus2

	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================

	;Features Enabled
	;-DLITE_VERSION=1  ;limits some features to save space for M5Launcher Compatibility
	-DHAS_MICROPHONE=1  ; Board has a microphone (wiring + type set in interface.cpp _setup_gpio)

	;Have RTC Chip
	-DHAS_RTC=1

	-DHAS_3_BUTTONS

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_CS=5
	-DTFT_DC=14
	-DTFT_RST=12
	-DTOUCH_CS=-1
	-DTFT_MOSI=15
	-DTFT_SCLK=13
	-DTFT_BL=27
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	-DARDUINO_M5STICK_C_PLUS2 ; Used in src/core/serial_commands/gpio_commands.cpp


	;Buttons configuration
	-DBTN_ALIAS='"M5"'

	;Infrared Led default pin and state
	; TXLED (19) / GROVE_SDA (32) / GROVE_SCL (33) resolved to literals below (both macros
	; migrated to bruceConfigPins.irTx/i2c_bus in _setup_gpio())
	-DIR_TX_PINS='{ {"Default", 19}, {"M5 IR Mod", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DIR_RX_PINS='{ {"M5 IR Mod", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"M5 RF433T", 32}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'
	-DRF_RX_PINS='{ {"M5 RF433R", 33}, {"G26",26}, {"G25",25}, {"G0",0}, {"Grove W", 33}, {"Grove Y", 32}}'

	-D ANALOG_BAT_PIN=38

	-DROTATION=3


	-DDEVICE_NAME='"M5StickC Plus2"'
	-DM5STICK ; Used in src/core/serial_commands/gpio_commands.cpp
	; Deepsleep
	-DDEEPSLEEP_WAKEUP_PIN=39
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
