; Waveshare ESP32-S3-Touch-AMOLED-1.75C
; https://www.waveshare.com/esp32-s3-touch-amoled-1.75c.htm
;
; Build:  pio run -e waveshare-amoled-175c -t build-firmware
; Most pin/feature definitions live in boards/waveshare-amoled-175c/pins_arduino.h

[env:waveshare-amoled-175c]
board = waveshare-amoled-175c
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-amoled-175c>
build_flags =
	${env.build_flags}
	-Iboards/waveshare-amoled-175c
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"Waveshare AMOLED 1.75C"'

lib_deps =
	${env.lib_deps}
	moononournation/GFX Library for Arduino @ 1.6.9
	lewisxhe/XPowersLib @0.2.7
	lewisxhe/SensorLib@0.3.4

; No RGB LED on this board. Newer FastLED releases also clash with Bruce's
; global FP/FM/FG font macros, so leave it out.
lib_ignore =
	FastLED
