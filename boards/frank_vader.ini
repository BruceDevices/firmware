; Frank Vader / Bruce Force — custom Bruce build profiles
;
; These environments extend upstream Bruce board configs. They only add
; build flags; no upstream board file is modified.
;
; FV_BUILD=1       selects the Frank Vader branding, serial banner, and
;                  the "FV Profile" / "FV Character" menu entries.
; FV_SAFE_MENU=1   hides Bruce's BadUSB/HID payload menu (requires explicit
;                 authorization to enable; no payloads are included here).

[env:fv_cardputer]
extends = env:m5stack-cardputer
build_flags =
    ${env:m5stack-cardputer.build_flags}
    -D FV_BUILD=1
    -D FV_SAFE_MENU=1

[env:fv_m5stick]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -D FV_BUILD=1
    -D FV_SAFE_MENU=1

[env:fv_tembed]
extends = env:lilygo-t-embed
build_flags =
    ${env:lilygo-t-embed.build_flags}
    -D FV_BUILD=1
    -D FV_SAFE_MENU=1
