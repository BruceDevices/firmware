[env:lilygo-t-hmi]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_upload.speed = 921600
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-hmi>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-hmi

	; ==================== Framework Control Flags ====================
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	-DDISABLE_ALL_LIBRARY_WARNINGS  ; Silence third-party library compiler warnings
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated

	; ==================== Feature gates ====================


	; it is physically grounded, using a NC(33) pin to avoid warnings on Serial during SD Readings

	; touch screen XPT2046
	; Pins set on .ini file
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)

	; BadUSB
	-DUSB_as_HID=1

	; ==================== Library Flags ====================

	-D TOUCH_XPT2046_SPI
	-D XPT2046_TOUCH_CONFIG_INT_GPIO_NUM=9

	; TFT_eSPI display
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DTFT_PARALLEL_8_BIT
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=-1
	-DTFT_WR=8
	-DTFT_RD=-1
	-DTFT_D0=48
	-DTFT_D1=47
	-DTFT_D2=39
	-DTFT_D3=40
	-DTFT_D4=41
	-DTFT_D5=42
	-DTFT_D6=45
	-DTFT_D7=46
	-DTFT_BL=38
	-DSMOOTH_FONT=1

	; ==================== Environment Flags ====================

	-DRF_TX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Pin 15", 15}, {"Pin 16", 16}, {"Pin 17", 17}, {"Pin 18", 18}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-D XPT2046_SPI_BUS_MISO_IO_NUM=4
	-D XPT2046_SPI_BUS_MOSI_IO_NUM=3
	-D XPT2046_SPI_BUS_SCLK_IO_NUM=1
	-D XPT2046_SPI_CONFIG_CS_GPIO_NUM=2
	-DDEVICE_NAME='"Lilygo T-HMI"'
	-DROTATION=3

	; Battery PIN
	-DANALOG_BAT_PIN=5

	; Mic

	; Buttons & Navigation
	-DBTN_ALIAS='"OK"'

	-DUSE_SD_MMC=1

lib_ignore =
	SD

