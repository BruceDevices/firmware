; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

##################################### CYD MODELS ####################################################
[CYD_base]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/CYD-2432S028

	; ==================== Framework Control Flags ====================
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; Used only in ESP32-S3 to make Serial Comands work

	; ==================== Feature gates ====================
	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	; ==================== Environment Flags ====================
	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DIR_RX_PINS='{{"Pin 27", 27}, {"Pin 22", 22}, {"Pin 35", 35}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DRF_RX_PINS='{{"Pin 27", 27}, {"Pin 22", 22}, {"Pin 35", 35}}'

	-DROTATION=3

	-DDEEPSLEEP_WAKEUP_PIN=36
	-DDEEPSLEEP_PIN_ACT=LOW


lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


[CYD35_base]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/CYD-2432S028

	; ==================== Framework Control Flags ====================

	; ==================== Feature gates ====================
	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================
	-DTFT_BL=27

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7796_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=480
	-DTFT_WIDTH=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	; ==================== Environment Flags ====================
	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 22", 22}}'
	-DIR_RX_PINS='{{"Pin 22", 22}, {"Pin 35", 35}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 22", 22}}'
	-DRF_RX_PINS='{{"Pin 22", 22}, {"Pin 35", 35}}'

	-DDEEPSLEEP_WAKEUP_PIN=36
	-DDEEPSLEEP_PIN_ACT=LOW


lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


##################################### CYD MODELS ####################################################
[env:CYD-2432S028]
extends=CYD_base
build_flags =
	${CYD_base.build_flags}

	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	; ==================== Library Flags ====================
	-DTFT_BL=21
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-2432S028"'

[env:CYD-2USB]
extends=env:CYD-2432S028
build_flags =
	${env:CYD-2432S028.build_flags}

	; ==================== Library Flags ====================
	;-DTFT_INVERSION_ON

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-2USB"'

[env:LAUNCHER_CYD-2USB]
extends=env:CYD-2432S028
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-2432S028.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

[env:CYD-2432W328C]
extends = CYD_base
build_flags =
	${CYD_base.build_flags}

	; ==================== Library Flags ====================
	-DTFT_INVERSION_ON
	-DTFT_BL=27
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
 	-DTOUCH_CS=-1  # This pin is used for I2C communication, not for CS SPI control in this device

	; ==================== Environment Flags ====================
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_CTRL_CST8XX=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DCST816S_I2C_CONFIG_SDA_IO_NUM=33
	-DCST816S_I2C_CONFIG_SCL_IO_NUM=32
	-DCST816S_TOUCH_CONFIG_RST_GPIO_NUM=25
	-DCST816S_TOUCH_CONFIG_INT_GPIO_NUM=21
	-DDEVICE_NAME='"CYD-2432W328C"'

[env:LAUNCHER_CYD-2432S028]
extends=env:CYD-2432S028
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-2432S028.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

[env:CYD-2432W328C_2] # commom to CYD-2432S024 Capacitive board
extends = env:CYD-2432W328C
build_unflags =
	-DTFT_INVERSION_ON
	-DDEVICE_NAME='"CYD-2432W328C_2"'

[env:LAUNCHER_CYD-2432W328C]
extends=env:CYD-2432W328C
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-2432W328C.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

[env:CYD-2432W328R-or-S024R]
extends = CYD_base
build_flags =
	${CYD_base.build_flags}

	; ==================== Library Flags ====================
	-DTFT_INVERSION_ON
	-DTFT_BL=27
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp), shares the display SPI
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	-DCYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=12
	-DCYD28_TouchR_MOSI=13
	-DCYD28_TouchR_CLK=14
	-DCYD28_TouchR_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-2432W328R-or-S024R"'

[env:LAUNCHER_CYD-2432W328R-or-S024R]
extends = env:CYD-2432W328R-or-S024R
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-2432W328R-or-S024R.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}


[env:CYD-3248S035R]
extends=CYD35_base
build_flags =
	${CYD35_base.build_flags}

	; ==================== Library Flags ====================
	-DST7796_DRIVER=1
	-DTFT_BL=27
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp), shares the display SPI
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	-DCYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=12
	-DCYD28_TouchR_MOSI=13
	-DCYD28_TouchR_CLK=14
	-DCYD28_TouchR_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-3248S035R"'

[env:LAUNCHER_CYD-3248S035R]
extends=env:CYD-3248S035R
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-3248S035R.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}

[env:CYD-3248S035C]
extends = CYD35_base
build_flags =
	${CYD35_base.build_flags}

	; ==================== Library Flags ====================
	-DTFT_INVERSION_ON
	-DTOUCH_CTRL_GT911=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
    -DGT911_TOUCH_CONFIG_INT_GPIO_NUM=25
    -DGT911_TOUCH_CONFIG_RST_GPIO_NUM=21
	-DTOUCH_CS=-1  # This pin is used for I2C communication, not for CS SPI control in this device

	; ==================== Environment Flags ====================
    -D SYS_I2C_SDA=33
    -D SYS_I2C_SCL=32
	-DHAS_CAPACITIVE_TOUCH=1
	-DDEVICE_NAME='"CYD-3248S035C"'

[env:LAUNCHER_CYD-3248S035C]
extends=env:CYD-3248S035C
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:CYD-3248S035C.build_flags}
	${env_light.build_flags}


################################# END OF CYD MODELS ####################################################
