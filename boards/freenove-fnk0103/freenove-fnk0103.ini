; PlatformIO Project Configuration File

[env:freenove-fnk0103]
board = esp32
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/freenove-fnk0103>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/freenove-fnk0103

	; ==================== Feature gates ====================
	-DHAS_TOUCH=1  ; Board has a touchscreen controller
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)

	; ==================== Library Flags ====================

	; Touch controller (resistive)
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=39
	-DTFT_MOSI=32
	-DTFT_SCLK=25
	-DTFT_CS=26
	-DTFT_DC=27
	-DTFT_RST=14
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"Freenove FNK0103 3.2 ST7789"'
	-DXPT2046_SPI_BUS_MISO_IO_NUM=39
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=32
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=25
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=33

	; --- migrated from pins_arduino.h ---
	-DUSB_VID=0x303a
	-DUSB_PID=0x1001
	-DBTN_ALIAS='"Ok"'
	-DROTATION=1

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}
