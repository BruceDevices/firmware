; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-dinmeter]
board = esp32s3
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_qspi ; VERIFY: old json had no explicit memory_type/PSRAM flag, assuming no PSRAM
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_src_filter =${env.build_src_filter} +<../boards/m5stack-dinmeter>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-dinmeter

	; ==================== Framework Control Flags ====================
	-D CORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)

	; ==================== Feature gates ====================
	-D HAS_ENCODER=1  ; Board has a rotary encoder for navigation

	;Can run USB as HID
	-D USB_as_HID=1  ;uncomment to enable

	; ==================== Library Flags ====================

	-D USE_M5GFX=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240

	; ==================== Environment Flags ====================
	-DM5STACK

	-D DEVICE_NAME='"M5DinMeter"'
	-D ROTATION=3
	-D BTN_ALIAS='"SEL"'

	;Sound options
	-D IR_TX_PINS='{{"G1",1},{"G2",2},{"G13",13},{"G15",15}}'
	-D IR_RX_PINS='{{"G1",1},{"G2",2},{"G13",13},{"G15",15}}'

	;Radio Frequency (one pin modules) pin setting
	-D RF_TX_PINS='{{"G1",1},{"G2",2},{"G13",13},{"G15",15}}'
	-D RF_RX_PINS='{{"G1",1},{"G2",2},{"G13",13},{"G15",15}}'

	-DADC=10

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified

lib_ignore =
	TFT_eSPI


