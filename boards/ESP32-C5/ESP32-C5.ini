[env:esp32-c5]
extends = env_4mb
board = esp32-c5-devkitc-1
board_build.partitions = custom_4Mb.csv

build_src_filter = ${env.build_src_filter} +<../boards/ESP32-C5>

build_flags =
    ${env.build_flags}
    ${env_4mb.build_flags}
    -Iboards/ESP32-C5
    -DDEVICE_NAME='"ESP32-C5"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBAD_RX=4
    -DBAD_TX=5

    ; Grove pins
    -DGROVE_SDA=0
    -DGROVE_SCL=1

    ; IR
    -DIR_TX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
    -DIR_RX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
    -DTXLED=27
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; RF one-pin
    -DRF_TX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
    -DRF_RX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'

    ; Disable unused SD and TFT
    -DSDCARD_CS=-1
    -DSDCARD_SCK=-1
    -DSDCARD_MISO=-1
    -DSDCARD_MOSI=-1
    -DBACKLIGHT=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_BL=-1

    ; Headless UI
    -DBTN_ALIAS='"OK"'

    ; CC1101 SPI
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=-1
    -DCC1101_SS_PIN=SPI_SS_PIN
    -DCC1101_MOSI_PIN=SPI_MOSI_PIN
    -DCC1101_SCK_PIN=SPI_SCK_PIN
    -DCC1101_MISO_PIN=SPI_MISO_PIN

    ; NRF24 SPI
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=24
    -DNRF24_SS_PIN=23
    -DNRF24_MOSI_PIN=SPI_MOSI_PIN
    -DNRF24_SCK_PIN=SPI_SCK_PIN
    -DNRF24_MISO_PIN=SPI_MISO_PIN

    ; Shared SPI bus
    -DSPI_SCK_PIN=10
    -DSPI_MOSI_PIN=8
    -DSPI_MISO_PIN=9
    -DSPI_SS_PIN=6
