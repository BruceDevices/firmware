; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c5]
board = esp32c5
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP32-C5>
build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DCORE_DEBUG_LEVEL=1  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Feature gates ====================
	-DHAS_RGB_LED=1  ; Board has an addressable RGB LED driven by FastLED (needs RGB_LED pin)
	;-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1  ; dont redefine pins
	-DILI9341_DRIVER=1  ; example only
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1
	; text sizes

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-C5"'
	; LP UART Pins are fixed on ESP32-C5
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_TYPE=WS2812
	-DLED_COLOR_STEP=15
	-DRGB_LED=27
	; grove pins
	; defaults from https://github.com/espressif/arduino-esp32/blob/master/variants/esp32s3/pins_arduino.h

	; ir led pin
	-DIR_TX_PINS='{{"Grove W", 1}, {"Grove Y", 0}}'
	-DIR_RX_PINS='{{"Grove W", 1}, {"Grove Y", 0}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Grove W", 1}, {"Grove Y", 0}}'
	-DRF_RX_PINS='{{"Grove W", 1}, {"Grove Y", 0}}'

	; sd card pins
	; suggested https://github.com/espressif/esp-idf/tree/master/examples/storage/sd_card/sdmmc

	; tft vars
	-DROTATION=1

	; ui control buttons
	-DBTN_ALIAS='"OK"'
