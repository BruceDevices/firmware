; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[m5stack-core_base]
board = esp32
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/m5stack-core>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-core

	; ==================== Feature gates ====================
	-DHAS_3_BUTTONS  ; Board navigates with exactly 3 physical buttons

	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Set this option to make use of all GPIOs, from 1 to 44 to be chosen, except TFT and SD pins

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_INVERSION_ON=1
	-DTFT_BACKLIGHT_ON=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=14
	-DTFT_DC=27
	-DTFT_RST=33
	-DTFT_BL=32
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; ==================== Environment Flags ====================
	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"M5 IR Mod", 21}, {"Grove W", 22}, {"Grove Y", 21}}'
	-DIR_RX_PINS='{{"M5 IR Mod", 22}, {"Grove W", 22}, {"Grove Y", 21}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"M5 RF433T", 21}, {"Grove W", 22}, {"Grove Y", 21}}'
	-DRF_RX_PINS='{{"M5 RF433R", 22}, {"Grove W", 22}, {"Grove Y", 21}}'

	-DROTATION=1
	-DM5STACK=1

	-DDEVICE_NAME='"M5Stack Core"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.11

[env:m5stack-core4mb]
extends=m5stack-core_base

lib_ignore =
	${env_4mb.lib_ignore}
	ST25R3916-fork
	NFC-RFAL-fork

build_flags =
	${m5stack-core_base.build_flags}
	${env_4mb.build_flags}

	; ==================== Feature gates ====================
	-DLITE_VERSION=1  #limits some features to save space for M5Launcher Compatibility


[env:m5stack-core16mb]
extends=m5stack-core_base
board_build.partitions = custom_16Mb.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size=532480
