; ESP32-S3-WROOM-1-N16R8 with an ST7789V TFT and XPT2046 touch controller.
; TFT: MOSI=18, SCLK=21, MISO=38, CS=15, DC=17, RST=16, BL=39.
; Touch: MOSI=42, SCLK=40, MISO=43, CS=41, IRQ=44.

[env:esp32-s3-n16r8-st7789v]
board = esp32-s3-n16r8-st7789v
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-n16r8-st7789v>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/esp32-s3-n16r8-st7789v
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DDEVICE_NAME='"ESP32-S3 N16R8 ST7789V"'

	; Display
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=39
	-DMINBRIGHT=10
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MOSI=18
	-DTFT_MISO=38
	-DTFT_SCLK=21
	-DTFT_CS=15
	-DTFT_DC=17
	-DTFT_RST=16
	-DTFT_BL=39
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000

	; Shared SPI aliases used by Bruce modules
	-DSPI_SCK_PIN=21
	-DSPI_MOSI_PIN=18
	-DSPI_MISO_PIN=38
	-DSPI_SS_PIN=15
	-DSDCARD_CS=-1
	-DSDCARD_SCK=21
	-DSDCARD_MISO=38
	-DSDCARD_MOSI=18

	; XPT2046 resistive touch
	-DHAS_TOUCH=1
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=44
	-DXPT2046_SPI_BUS_MISO_IO_NUM=43
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=42
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=40
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=41
	-DTOUCH_CS=41

	; No onboard buttons or battery gauge are assumed
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=-1
	-DBTN_ACT=LOW
	; No dedicated CH9329 BadUSB UART pins are available
	-DBAD_TX=-1
	-DBAD_RX=-1
	-DRGB_LED=-1
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	; Text sizes
	-DFP=1
	-DFM=2
	-DFG=3

lib_deps =
	${env.lib_deps}
