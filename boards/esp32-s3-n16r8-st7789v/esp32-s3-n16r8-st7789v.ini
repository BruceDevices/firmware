; ESP32-S3-WROOM-1-N16R8 with an ST7789V TFT and XPT2046 touch controller.
; TFT: MOSI=18, SCLK=21, MISO=38, CS=15, DC=17, RST=16, BL=39.
; Touch: MOSI=42, SCLK=40, MISO=43, CS=41, IRQ=44.

[env:esp32-s3-n16r8-st7789v]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-n16r8-st7789v>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/esp32-s3-n16r8-st7789v

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DDISABLE_ALL_LIBRARY_WARNINGS  ; Silence third-party library compiler warnings

	; ==================== Feature gates ====================
	; XPT2046 resistive touch
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MOSI=18
	-DTFT_MISO=38
	-DTFT_SCLK=21
	-DTFT_CS=15
	-DTFT_DC=17
	-DTFT_RST=16
	-DTFT_BL=39
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=44
	-DTOUCH_CS=41

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-S3 N16R8 ST7789V"'
	-DROTATION=1
	-DXPT2046_SPI_BUS_MISO_IO_NUM=43
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=42
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=40
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=41

	; No onboard buttons or battery gauge are assumed
	-DBTN_ALIAS='"Ok"'
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

lib_deps =
	${env.lib_deps}
