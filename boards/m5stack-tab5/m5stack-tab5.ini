; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-tab5]
board = esp32p4
board_build.partitions = custom_16Mb.csv
board_upload.speed = 1500000
build_src_filter =${env.build_src_filter} +<../boards/m5stack-tab5>
build_src_flags =
	${env.build_src_flags}
	-D FP=2
	-D FM=4
	-D FG=6

build_flags =
	${env.build_flags}

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM  ; Board has PSRAM populated
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial over native USB-CDC instead of UART0


	-D BOARD_HAS_SDIO_ESP_HOSTED=1
	-D BOARD_SDIO_ESP_HOSTED_CLK=12
	-D BOARD_SDIO_ESP_HOSTED_CMD=13
	-D BOARD_SDIO_ESP_HOSTED_D0=11
	-D BOARD_SDIO_ESP_HOSTED_D1=10
	-D BOARD_SDIO_ESP_HOSTED_D2=9
	-D BOARD_SDIO_ESP_HOSTED_D3=8
	-D BOARD_SDIO_ESP_HOSTED_RESET=15

	; ==================== Feature gates ====================

	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)
	-DHAS_KEYBOARD=1  ; Board has a physical keyboard
	-DHAS_TOUCH=1  ; Board has a touchscreen controller

	; ==================== Library Flags ====================

	-DUSE_M5GFX=1

	-DTFT_WIDTH=720
	-DTFT_HEIGHT=1280

	; ==================== Environment Flags ====================
	-DM5STACK
	-DROTATION=3
	-DDEVICE_NAME='"M5Stack Tab5"'

lib_deps =
	${env.lib_deps}
	m5stack/M5Unified @ ^0.2.17
	m5stack/M5Unit-KEYBOARD
	; P4 BLE runs host-only over the ESP-Hosted co-processor (C6). The bundled NimBLE-Arduino
	; stack cannot drive that transport, so use esp-nimble-cpp (C++ API only) on top of the
	; framework's IDF NimBLE (libbt) + its hosted HCI transport. NimBLE-Arduino is ignored below.
	h2zero/esp-nimble-cpp@2.5.0


lib_ignore =
	${env.lib_ignore}
	TFT_eSPI
	NimBLE-Arduino
