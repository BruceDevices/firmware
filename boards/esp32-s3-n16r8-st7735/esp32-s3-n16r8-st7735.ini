; ESP32-S3 N16R8 (DevKitC-1 style) + 1.8" ST7735 128x160 SPI screen + 3 buttons.
; Screen (own HSPI bus): SCLK=5, MOSI=6, CS=16, DC=7, RST=15, BL=4.
; Buttons to GND: previous=39, select=41, next=42 (previous + next together = back).
; Wiring and module pins: connections.md.
[env:esp32-s3-n16r8-st7735]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-n16r8-st7735>
build_flags =
	${env.build_flags}
	-Iboards/esp32-s3-n16r8-st7735

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1  ; Board has PSRAM populated
	-DARDUINO_USB_CDC_ON_BOOT  ; Route Serial over native USB-CDC instead of UART0
	-DARDUINO_USB_MODE=1  ; Select ESP32-S3 USB peripheral mode (1 = USB-OTG/CDC)
	-DUSB_as_HID=1  ; Board can act as a USB HID device (BadUSB/ducky typer, U2F, clicker)

	; ==================== Feature gates ====================
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; any free GPIO can be chosen for IR / one-pin RF
	-DHAS_3_BUTTONS=1

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB2=1  ; common red 1.8" 128x160 module. Noise on two edges or wrong colours: try ST7735_BLACKTAB or ST7735_REDTAB
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MOSI=6
	-DTFT_SCLK=5
	-DTFT_MISO=-1
	-DTFT_CS=16
	-DTFT_DC=7
	-DTFT_RST=15
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-S3 ST7735"'
	-DROTATION=1
	-DBTN_ALIAS='"OK"'
	; text sizes for a 160x128 screen
	-DFP=1
	-DFM=1
	-DFG=2
lib_deps =
	${env.lib_deps}
