; PlatformIO Project Configuration File
; ESP-WROOM-32 + ST7789 2.8" TFT with XPT2046 Touch
;
; TFT Pins (VSPI): MISO=19, MOSI=23, SCLK=18, CS=17, DC=16, RST=5, BL=32
; Touch (XPT2046):  CS=21, shares VSPI bus (MISO=19, MOSI=23, SCLK=18)
; SD Card:          CS=12, shares VSPI bus

[env:esp-wroom32-st7789]
board = esp-wroom32-st7789
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp-wroom32-st7789>
build_flags =
	${env.build_flags}
	-Iboards/esp-wroom32-st7789
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1

	-DDEVICE_NAME='"ESP32-ST7789 Touch"'

	; Boot button as OK
	-DHAS_BTN=1
	-DBTN_ALIAS='"OK"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	; Infrared Led
	-DIR_TX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'
	-DIR_RX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'
	-DTXLED=2
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'
	-DRF_RX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'

	; CC1101 SPI connection pins
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=2
	-DCC1101_SS_PIN=15
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	; NRF24 SPI connection pins
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=4
	-DNRF24_SS_PIN=15
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	; W5500 Ethernet (disabled by default)
	;-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=-1
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=-1

	; Lora setup pins (not connected by default)
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=-1
	-DLORA_RST=-1
	-DLORA_DIO0=-1

	; FM Radio
	-DFM_RSTPIN=-1

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen Setup
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1

	; TFT_eSPI display — ST7789 240x320 SPI (VSPI)
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=17
	-DTFT_DC=16
	-DTFT_RST=5
	-DTFT_BL=32
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_MISO=19
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Touchscreen — XPT2046 resistive (shares VSPI bus with display)
	-DHAS_TOUCH=1
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=23
	-DXPT2046_SPI_BUS_MISO_IO_NUM=19
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=18
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=21
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	; SD Card pins (on VSPI bus)
	-DSDCARD_CS=12
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

	; Default I2C port
	-DGROVE_SDA=21
	-DGROVE_SCL=22

	; SERIAL (GPS) dedicated pins
	-DSERIAL_TX=1
	-DSERIAL_RX=3
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Main SPI bus pins (for CC1101/NRF24/etc)
	-DSPI_SCK_PIN=18
	-DSPI_MOSI_PIN=23
	-DSPI_MISO_PIN=19
	-DSPI_SS_PIN=15

lib_deps =
	${env.lib_deps}

